<body class="text-slate-800">

<div id="app"><div class="min-h-screen flex items-center justify-center"><div class="spin"></div></div></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
var S = { token: null, user: null, cfg: null, view: 'beranda', data: {}, sub: {} };

var ROLE = { SA: 'superadmin', KT: 'ketua', SK: 'sekretaris', BD: 'bendahara', KG: 'koordinator', WG: 'warga' };
var PENGURUS = ['superadmin', 'ketua', 'sekretaris', 'bendahara', 'koordinator'];
var ADMIN_LAYANAN = ['superadmin', 'ketua', 'sekretaris'];
var ADMIN_KAS = ['superadmin', 'ketua', 'bendahara'];
var ADMIN_IPL = ['superadmin', 'ketua', 'bendahara', 'koordinator'];
var PENYETUJU_PINJAM = ['superadmin', 'ketua'];
var UNDUH_LAPORAN = ['superadmin', 'ketua', 'sekretaris', 'bendahara'];
var BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
var BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

function can(list) { return !!S.user && list.indexOf(S.user.role) >= 0; }

function store(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; }
}

function call(action, payload) {
  return new Promise(function (resolve, reject) {
    var done = function (raw) {
      var r;
      try { r = JSON.parse(raw); } catch (e) { reject(new Error('Respon server tidak valid.')); return; }
      if (r.ok) { resolve(r.data); return; }
      if (r.relogin) { keluarLokal(); toast(r.error, 'err'); }
      reject(new Error(r.error));
    };
    google.script.run.withSuccessHandler(done).withFailureHandler(function (e) {
      reject(new Error((e && e.message) || 'Gagal terhubung ke server.'));
    }).api(S.token, action, JSON.stringify(payload || {}));
  });
}

function h(s) {
  return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\x22/g, '&quot;').replace(/\x27/g, '&#39;');
}
function rp(n) { return 'Rp ' + Number(n || 0).toLocaleString('id-ID'); }
function tgl(s) {
  var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?/);
  if (!m) return h(s);
  return Number(m[3]) + ' ' + BLN[Number(m[2]) - 1] + ' ' + m[1] + (m[4] ? ', ' + m[4] + '.' + m[5] : '');
}
function tglPendek(s) { var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? Number(m[3]) + ' ' + BLN[Number(m[2]) - 1] + ' ' + m[1] : h(s); }
function periodeLabel(p) { return BULAN[Number(String(p).slice(5, 7)) - 1] + ' ' + String(p).slice(0, 4); }
function hariIni() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

function toast(msg, type) {
  var el = document.getElementById('toast-root');
  var c = type === 'err' ? 'bg-red-600' : 'bg-slate-900';
  el.innerHTML = '<div class="toast ' + c + ' text-white text-sm px-4 py-3 rounded-xl shadow-lg flex items-center gap-2"><i class="fa-solid ' + (type === 'err' ? 'fa-circle-exclamation' : 'fa-circle-check') + '"></i><span>' + h(msg) + '</span></div>';
  clearTimeout(toast.t);
  toast.t = setTimeout(function () { el.innerHTML = ''; }, 3800);
}

function loadingHtml() { return '<div class="py-16 flex justify-center"><div class="spin"></div></div>'; }
function kosong(ikon, teks) { return '<div class="text-center py-12 text-slate-400"><i class="fa-solid ' + ikon + ' text-4xl mb-3"></i><div class="text-sm">' + h(teks) + '</div></div>'; }

function chip(status) {
  var m = {
    menunggu: ['bg-amber-100 text-amber-800', 'fa-clock', 'Menunggu'],
    disetujui: ['bg-emerald-100 text-emerald-800', 'fa-check', 'Disetujui'],
    ditolak: ['bg-red-100 text-red-700', 'fa-xmark', 'Ditolak'],
    dikembalikan: ['bg-slate-100 text-slate-700', 'fa-rotate-left', 'Dikembalikan'],
    baru: ['bg-sky-100 text-sky-800', 'fa-inbox', 'Baru'],
    diproses: ['bg-amber-100 text-amber-800', 'fa-spinner', 'Diproses'],
    selesai: ['bg-emerald-100 text-emerald-800', 'fa-check-double', 'Selesai'],
    aktif: ['bg-emerald-100 text-emerald-800', 'fa-check', 'Aktif'],
    nonaktif: ['bg-slate-200 text-slate-600', 'fa-ban', 'Nonaktif'],
    draf: ['bg-slate-200 text-slate-700', 'fa-pen', 'Draf'],
    buka: ['bg-emerald-100 text-emerald-800', 'fa-box-open', 'Dibuka'],
    tutup: ['bg-slate-800 text-white', 'fa-lock', 'Ditutup']
  }[status] || ['bg-slate-100 text-slate-700', 'fa-circle', status];
  return '<span class="chip ' + m[0] + '"><i class="fa-solid ' + m[1] + '"></i>' + m[2] + '</span>';
}

function openModal(title, body, opt) {
  opt = opt || {};
  var root = document.getElementById('modal-root');
  root.innerHTML = '<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal ' + (opt.lebar ? 'lebar' : '') + '">' +
    '<div class="flex items-center justify-between px-5 py-4 border-b"><h3 class="font-bold text-lg truncate pr-3">' + h(title) + '</h3>' +
    '<button class="w-10 h-10 rounded-full hover:bg-slate-100 shrink-0" onclick="closeModal()" aria-label="Tutup"><i class="fa-solid fa-xmark text-lg"></i></button></div>' +
    '<div class="overflow-y-auto px-5 pb-6 pt-2 safe-b" id="modal-body">' + body + '</div></div></div>';
  document.body.style.overflow = 'hidden';
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; document.body.style.overflow = ''; }

function formData(id) {
  var f = document.getElementById(id), o = {};
  Array.prototype.forEach.call(f.elements, function (el) {
    if (!el.name) return;
    if (el.type === 'checkbox') {
      if (el.dataset.multi) { o[el.name] = o[el.name] || []; if (el.checked) o[el.name].push(el.value); }
      else o[el.name] = el.checked;
    } else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
    else o[el.name] = el.value;
  });
  return o;
}

function kirim(btn, action, payload, sukses) {
  var asli = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
  return call(action, payload).then(function (d) {
    btn.disabled = false; btn.innerHTML = asli;
    if (sukses) sukses(d);
    return d;
  }).catch(function (e) { btn.disabled = false; btn.innerHTML = asli; toast(e.message, 'err'); });
}

function konfirmasi(teks, okLabel, fn) {
  openModal('Konfirmasi', '<p class="py-3 text-slate-700">' + h(teks) + '</p><div class="flex gap-2 justify-end mt-2">' +
    '<button class="btn btn-s" onclick="closeModal()">Batal</button><button class="btn btn-p" id="btn-ok">' + h(okLabel || 'Ya') + '</button></div>');
  document.getElementById('btn-ok').onclick = function () { fn(this); };
}

function opsiSelect(list, val, kosongLabel) {
  return (kosongLabel ? '<option value="">' + h(kosongLabel) + '</option>' : '') + list.map(function (x) {
    var v = typeof x === 'string' ? x : x[0], l = typeof x === 'string' ? x : x[1];
    return '<option value="' + h(v) + '"' + (String(v) === String(val) ? ' selected' : '') + '>' + h(l) + '</option>';
  }).join('');
}

function kopMini(cfg, terang) {
  return '<div class="flex items-center gap-3 min-w-0"><img src="' + cfg.LOGO + '" class="w-11 h-11 object-contain bg-white rounded-xl p-0.5 shrink-0" alt="Logo">' +
    '<div class="min-w-0 leading-tight"><div class="font-extrabold ' + (terang ? 'text-white' : 'text-emerald-900') + ' truncate">RT ' + h(cfg.RT) + ' / RW ' + h(cfg.RW) + '</div>' +
    '<div class="text-xs ' + (terang ? 'text-emerald-100' : 'text-slate-500') + ' truncate">' + h(cfg.SEBUTAN_DESA) + ' ' + h(cfg.DESA) + ', Kec. ' + h(cfg.KECAMATAN) + '</div></div></div>';
}
function sebutKab(cfg) { return (cfg.SEBUTAN_KAB === 'Kota' ? 'Kota ' : 'Kab. ') + cfg.KABUPATEN;
}

function layarPenuh() {
  var hp = window.matchMedia && window.matchMedia('(pointer: coarse)').matches && window.innerWidth < 1024;
  var el = document.documentElement;
  var minta = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!hp || !minta || !(document.fullscreenEnabled || document.webkitFullscreenEnabled)) return;
  var coba = function () {
    document.removeEventListener('pointerup', coba, true);
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    try { var r = minta.call(el, { navigationUI: 'hide' }); if (r && r.catch) r.catch(function () { }); } catch (e) { }
  };
  document.addEventListener('pointerup', coba, true);
}

function boot() {
  layarPenuh();
  S.token = store('sirt_token');
  if (S.token) {
    call('auth.me', { logoKey: kunciLogo() }).then(function (d) { S.user = d.user; S.cfg = terimaCfg(d.cfg); renderShell(); go(store('sirt_view') || 'beranda'); })
      .catch(function () { keluarLokal(); });
  } else renderPublik();
}

function keluarLokal() { S.token = null; S.user = null; S.sub = {}; S.data = {}; store('sirt_token', null); renderPublik(); }

function kunciLogo() { return store('sirt_logo') ? store('sirt_logo_key') || '' : ''; }
function terimaCfg(c) {
  if (c.LOGO_CACHE) c.LOGO = store('sirt_logo') || '';
  else if (c.LOGO) { store('sirt_logo', c.LOGO); store('sirt_logo_key', c.LOGO_KEY); }
  return c;
}

function renderPublik() {
  closeModal();
  document.getElementById('app').innerHTML = loadingHtml();
  call('publik.beranda', { logoKey: kunciLogo() }).then(function (d) {
    S.cfg = d.cfg = terimaCfg(d.cfg);
    var c = d.cfg;
    var info = d.info.length ? d.info.map(function (x) {
      return '<article class="card p-4"><div class="flex items-start gap-3"><div class="w-10 h-10 rounded-xl ' + (x.penting === 'ya' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700') + ' flex items-center justify-center shrink-0"><i class="fa-solid fa-bullhorn"></i></div>' +
        '<div class="min-w-0"><div class="text-xs text-slate-500">' + tgl(x.tanggal) + (x.penting === 'ya' ? ' &middot; <span class="text-amber-700 font-semibold">Penting</span>' : '') + '</div>' +
        '<h3 class="font-bold">' + h(x.judul) + '</h3><p class="text-sm text-slate-600 pre mt-1">' + h(x.isi) + '</p></div></div></article>';
    }).join('') : kosong('fa-bullhorn', 'Belum ada pengumuman.');
    var pengurus = d.pengurus.length ? d.pengurus.map(function (p) {

    }).join('') : '<div class="text-sm text-slate-400">Belum diisi.</div>';
    var darurat = c.KONTAK_DARURAT.map(function (k) {
      return '<a href="tel:' + h(k.nomor) + '" class="flex items-center justify-between py-2.5 border-b last:border-0"><span class="text-sm">' + h(k.nama) + '</span><span class="font-bold text-red-600"><i class="fa-solid fa-phone text-xs"></i> ' + h(k.nomor) + '</span></a>';
    }).join('');
    document.getElementById('app').innerHTML =
      '<header class="bg-gradient-to-br from-emerald-800 to-emerald-600 text-white">' +
      '<div class="max-w-5xl mx-auto px-4 pt-5 pb-20"><div class="flex items-center justify-between gap-3">' + kopMini(c, true) +
      '<button class="btn bg-white text-emerald-800 btn-sm shrink-0" onclick="formLogin()"><i class="fa-solid fa-right-to-bracket"></i> Masuk</button></div>' +
      '<div class="mt-6"><div class="text-emerald-100 text-sm">Selamat datang di</div><h1 class="text-[22px] sm:text-3xl font-extrabold leading-tight">Sistem Informasi RT ' + h(c.RT) + ' / RW ' + h(c.RW) + '</h1>' +
      '<p class="text-emerald-50 text-sm mt-1">' + h(c.PERUMAHAN) + ' &middot; ' + h(sebutKab(c)) + '</p></div></div></header>' +
      '<main class="max-w-5xl mx-auto px-4 -mt-14 pb-10 space-y-5">' +
      '<section class="card p-4"><div class="flex items-center justify-between"><h2 class="font-bold"><i class="fa-solid fa-scale-balanced text-emerald-700"></i> Transparansi Kas RT</h2><span class="text-xs text-slate-500">' + h(d.kas.bulan) + '</span></div>' +
      '<div class="mt-3 grid grid-cols-2 sm:grid-cols-3 gap-2 text-center">' +
      '<div class="col-span-2 sm:col-span-1 rounded-xl bg-emerald-50 p-3"><div class="text-[11px] text-slate-500">Saldo Kas</div><div class="font-extrabold text-emerald-800 text-xl whitespace-nowrap">' + rp(d.kas.saldo) + '</div></div>' +
      '<div class="rounded-xl bg-sky-50 p-3"><div class="text-[11px] text-slate-500">Masuk bulan ini</div><div class="font-bold text-sky-700 whitespace-nowrap">' + rp(d.kas.masuk) + '</div></div>' +
      '<div class="rounded-xl bg-rose-50 p-3"><div class="text-[11px] text-slate-500">Keluar bulan ini</div><div class="font-bold text-rose-700 whitespace-nowrap">' + rp(d.kas.keluar) + '</div></div></div></section>' +
      (d.pemilihan && d.pemilihan.length ? d.pemilihan.map(function (v) {
        return '<section class="card p-4"><h2 class="font-bold text-lg"><i class="fa-solid fa-check-to-slot text-emerald-700"></i> ' + h(v.judul) + '</h2>' +
          (v.keterangan ? '<p class="text-sm text-slate-500 pre">' + h(v.keterangan) + '</p>' : '') +
          '<p class="text-xs text-slate-500 mt-1">Kenali visi &amp; misi setiap calon. Pemungutan suara dilakukan setelah masuk (login); 1 KK terdaftar = 1 suara.</p>' +
          (v.kandidat.length ? '<div class="grid sm:grid-cols-2 gap-3 mt-3">' + v.kandidat.map(kartuCalonPublik).join('') + '</div>' : '<p class="text-sm text-slate-400 mt-3">Calon belum diumumkan.</p>') + '</section>';
      }).join('') : '') +
      '<div class="grid lg:grid-cols-3 gap-5"><section class="lg:col-span-2 space-y-3"><h2 class="font-bold text-lg">Pengumuman Lingkungan</h2>' + info + '</section>' +
      '<aside class="space-y-5"><section class="card p-4"><h2 class="font-bold mb-1"><i class="fa-solid fa-users text-emerald-700"></i> Pengurus RT</h2>' + pengurus + '</section>' +
      '<section class="card p-4"><h2 class="font-bold mb-1"><i class="fa-solid fa-truck-medical text-red-600"></i> Kontak Darurat</h2>' + darurat + '</section>' +
      '<section class="card p-4 bg-emerald-50 border-emerald-200"><h2 class="font-bold">Layanan Warga</h2><p class="text-sm text-slate-600 mt-1">Masuk untuk cek iuran IPL, mengajukan surat pengantar, lapor masalah lingkungan, pinjam aset RT, e-Vote, dan diskusi warga.</p>' +
      '<div class="flex gap-2 mt-3"><button class="btn btn-p flex-1" onclick="formLogin()">Masuk</button>' + (c.IZINKAN_DAFTAR === 'ya' ? '<button class="btn btn-s flex-1" onclick="formDaftar()">Daftar</button>' : '') + '</div></section></aside></div>' +
      '<footer class="text-center text-xs text-slate-400 pt-4">' + h(c.NAMA_APP) + ' &middot; RT ' + h(c.RT) + ' / RW ' + h(c.RW) + ' ' + h(c.SEBUTAN_DESA) + ' ' + h(c.DESA) + '</footer></main>';
  }).catch(function (e) {
    document.getElementById('app').innerHTML = '<div class="max-w-md mx-auto p-6 mt-20 card text-center"><i class="fa-solid fa-triangle-exclamation text-3xl text-amber-500"></i><p class="mt-3">' + h(e.message) + '</p><button class="btn btn-p mt-4" onclick="renderPublik()">Coba lagi</button></div>';
  });
}

function formLogin() {
  openModal('Masuk Warga / Pengurus', '<form id="f-login" onsubmit="return false"><label class="lbl">No. HP</label><input class="inp" name="no_hp" inputmode="tel" autocomplete="username" placeholder="08xxxxxxxxxx">' +
    '<label class="lbl">PIN (6 digit)</label><input class="inp" name="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;">' +
    '<button class="btn btn-p w-full mt-5" id="b-login"><i class="fa-solid fa-right-to-bracket"></i> Masuk</button>' +
    (S.cfg && S.cfg.IZINKAN_DAFTAR === 'ya' ? '<p class="text-sm text-center mt-4 text-slate-500">Belum punya akun? <a class="text-emerald-700 font-semibold" href="javascript:void(0)" onclick="formDaftar()">Daftar di sini</a></p>' : '') +
    '<p class="text-xs text-center mt-2 text-slate-400">Lupa PIN? Hubungi Sekretaris / Ketua RT untuk reset.</p></form>');
  document.getElementById('b-login').onclick = function () {
    kirim(this, 'auth.login', formData('f-login'), function (d) {
      S.token = d.token; S.user = d.user; S.sub = {}; S.data = {}; store('sirt_token', d.token);
      closeModal(); renderShell(); go('beranda');
      if (d.pinDefault) setTimeout(function () { toast('Anda masih memakai PIN bawaan. Segera ganti di menu Profil.', 'err'); }, 600);
    });
  };
}

function formDaftar() {
  openModal('Daftar Akun Warga', '<form id="f-daftar" onsubmit="return false"><p class="text-sm text-slate-500">Akun aktif setelah disetujui pengurus RT.</p>' +
    '<label class="lbl">Nama lengkap (Kepala Keluarga)</label><input class="inp" name="nama">' +
    '<label class="lbl">No. HP / WhatsApp</label><input class="inp" name="no_hp" inputmode="tel" placeholder="08xxxxxxxxxx">' +
    '<div class="grid grid-cols-2 gap-3"><div><label class="lbl">Blok</label><select class="inp" name="gang">' + opsiSelect(S.cfg.GANG, '', '- pilih -') + '</select></div>' +
    '<div><label class="lbl">No. Rumah</label><input class="inp" name="no_rumah" placeholder="A-12"></div></div>' +
    '<label class="lbl">Buat PIN (6 digit angka)</label><input class="inp" name="pin" type="password" inputmode="numeric" maxlength="6">' +
    '<button class="btn btn-p w-full mt-5" id="b-daftar"><i class="fa-solid fa-user-plus"></i> Kirim Pendaftaran</button></form>');
  document.getElementById('b-daftar').onclick = function () {
    kirim(this, 'auth.daftar', formData('f-daftar'), function (d) {
      openModal('Pendaftaran Terkirim', '<div class="text-center py-6"><i class="fa-solid fa-circle-check text-5xl text-emerald-600"></i><p class="mt-4">' + h(d.pesan) + '</p><button class="btn btn-p mt-5" onclick="closeModal()">Mengerti</button></div>');
    });
  };
}

  { id: 'iuran', ikon: 'fa-hand-holding-heart', label: 'Iuran Kegiatan', roles: null },
  { id: 'surat', ikon: 'fa-file-signature', label: 'Surat Pengantar', roles: null },
  { id: 'lapor', ikon: 'fa-triangle-exclamation', label: 'Laporan Warga', roles: null },
  { id: 'laporan', ikon: 'fa-file-arrow-down', label: 'Unduh Laporan', roles: UNDUH_LAPORAN },
  { id: 'aset', ikon: 'fa-box-archive', label: 'Aset & Pinjam', roles: null },
  { id: 'info', ikon: 'fa-bullhorn', label: 'Pengumuman', roles: null },
  { id: 'vote', ikon: 'fa-check-to-slot', label: 'e-Vote Ketua RT', roles: null },
  { id: 'forum', ikon: 'fa-comments', label: 'Diskusi Warga', roles: null },
  { id: 'kk', ikon: 'fa-people-roof', label: 'Data Keluarga', roles: null },

  { id: 'log', ikon: 'fa-clock-rotate-left', label: 'Log Aktivitas', roles: ['superadmin'] },
  { id: 'setting', ikon: 'fa-gear', label: 'Pengaturan', roles: ['superadmin'] },
  { id: 'profil', ikon: 'fa-user', label: 'Profil Saya', roles: null }
];
var BOTTOM = ['beranda', 'ipl', 'surat', 'forum', 'menu'];

function menuBoleh() { return MENU.filter(function (m) { return !m.roles || can(m.roles); }); }

function renderShell() {
  var c = S.cfg, u = S.user;
  var side = menuBoleh().map(function (m) {
    return '<a href="javascript:void(0)" data-v="' + m.id + '" class="side-a" onclick="go(\'' + m.id + '\')"><i class="fa-solid ' + m.ikon + ' w-5 text-center"></i>' + m.label + '</a>';
  }).join('');
  var bottom = BOTTOM.map(function (id) {
    var m = id === 'menu' ? { ikon: 'fa-grip', label: 'Menu' } : MENU.filter(function (x) { return x.id === id; })[0];
    var lbl = { beranda: 'Beranda', ipl: 'IPL', surat: 'Surat', forum: 'Diskusi', menu: 'Menu' }[id];
    return '<button class="nav-b" data-v="' + id + '" onclick="go(\'' + id + '\')"><i class="fa-solid ' + m.ikon + '"></i>' + lbl + '</button>';
  }).join('');
  document.getElementById('app').innerHTML =
    '<header class="sticky top-0 z-30 bg-emerald-800 text-white shadow"><div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">' + kopMini(c, true) +
    '<button class="flex items-center gap-2 min-w-0 rounded-xl hover:bg-emerald-700 px-2 py-1" onclick="go(\'profil\')"><div class="text-right min-w-0 hidden sm:block"><div class="text-sm font-semibold truncate max-w-[160px]">' + h(u.nama) + '</div><div class="text-[11px] text-emerald-200">' + h(u.role_label) + (u.gang ? ' &middot; ' + h(u.gang) : '') + '</div></div>' +
    '<div class="w-10 h-10 rounded-full bg-white text-emerald-800 font-extrabold flex items-center justify-center shrink-0">' + h(u.nama.charAt(0)) + '</div></button></div></header>' +
    '<div class="max-w-6xl mx-auto lg:flex lg:gap-6 lg:px-4"><nav class="hidden lg:block w-60 shrink-0 pt-5"><div class="sticky top-20 space-y-1">' + side +
    '<button class="side-a w-full text-red-700" onclick="logout()"><i class="fa-solid fa-right-from-bracket w-5 text-center"></i>Keluar</button></div></nav>' +
    '<main id="view" class="flex-1 min-w-0 px-4 lg:px-0 pt-5 pb-nav"></main></div>' +
    '<nav class="lg:hidden fixed bottom-0 inset-x-0 z-40 bg-white border-t safe-b"><div class="flex max-w-xl mx-auto">' + bottom + '</div></nav>';
}

function go(v) {
  if (v !== 'menu' && !menuBoleh().some(function (m) { return m.id === v; })) v = 'beranda';
  S.view = v;
  if (v !== 'menu') store('sirt_view', v);
  document.querySelectorAll('[data-v]').forEach(function (el) {
    var on = el.dataset.v === v || (el.classList.contains('nav-b') && el.dataset.v === 'menu' && BOTTOM.indexOf(v) < 0);
    el.classList.toggle('on', on);
  });
  window.scrollTo(0, 0);
  var el = document.getElementById('view');
  el.innerHTML = loadingHtml();
  var fn = VIEWS[v] || VIEWS.beranda;
  fn(el);
}
function refresh() { go(S.view); }

function judul(t, sub, aksi) {
  return '<div class="flex items-end justify-between gap-3 mb-4"><div class="min-w-0"><h1 class="text-xl sm:text-2xl font-extrabold text-slate-900">' + t + '</h1>' +
    (sub ? '<p class="text-sm text-slate-500">' + sub + '</p>' : '') + '</div><div class="shrink-0">' + (aksi || '') + '</div></div>';
}

function tabs(key, list, def) {
  var cur = S.sub[key] || def || list[0][0];
  return '<div class="scroll-x flex gap-2 mb-4 -mx-4 px-4 lg:mx-0 lg:px-0">' + list.map(function (t) {
    return '<button class="tab ' + (t[0] === cur ? 'on' : '') + '" onclick="S.sub[\'' + key + '\']=\'' + t[0] + '\';refresh()">' + t[1] + '</button>';
  }).join('') + '</div>';
}

function gagal(el, e) { el.innerHTML = '<div class="card p-6 text-center"><i class="fa-solid fa-triangle-exclamation text-3xl text-amber-500"></i><p class="mt-2">' + h(e.message) + '</p><button class="btn btn-s mt-4" onclick="refresh()">Muat ulang</button></div>'; }

function logout() {
  konfirmasi('Keluar dari aplikasi?', 'Keluar', function () {
    call('auth.logout').catch(function () { });
    store('sirt_view', null);
    keluarLokal();
  });
}

    return '<button class="card p-3 flex flex-col items-center gap-2 text-center hover:border-emerald-400 min-h-[96px] justify-center" onclick="go(\'' + m.id + '\')"><div class="w-11 h-11 rounded-2xl bg-emerald-50 text-emerald-700 flex items-center justify-center"><i class="fa-solid ' + m.ikon + ' text-lg"></i></div><span class="text-xs font-semibold leading-tight">' + m.label + '</span></button>';
  }).join('') + '<button class="card p-3 flex flex-col items-center gap-2 text-center min-h-[96px] justify-center" onclick="logout()"><div class="w-11 h-11 rounded-2xl bg-red-50 text-red-600 flex items-center justify-center"><i class="fa-solid fa-right-from-bracket text-lg"></i></div><span class="text-xs font-semibold">Keluar</span></button></div>';

var WARNA_MASUK = '#0284c7', WARNA_KELUAR = '#e11d48';

function rpPendek(n) {
  var a = Math.abs(n), t;
  if (a >= 1e9) t = (a / 1e9).toFixed(a % 1e9 ? 1 : 0) + ' M';
  else if (a >= 1e6) t = (a / 1e6).toFixed(a % 1e6 ? 1 : 0) + ' jt';
  else if (a >= 1e3) t = Math.round(a / 1e3) + ' rb';
  else t = String(a);
  return (n < 0 ? '-' : '') + t.replace('.', ',');
}
function skalaRapi(maks) {
  if (maks <= 0) return { maks: 100000, step: 25000 };
  var kasar = maks / 4, pangkat = Math.pow(10, Math.floor(Math.log(kasar) / Math.LN10)), f = kasar / pangkat;
  var step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * pangkat;
  return { maks: step * Math.ceil(maks / step), step: step };
}

function muatGrafik() {
  var box = document.getElementById('grafik-kas');
  if (!box) return;
  var kini = new Date();
  var g = S.sub.grafik || (S.sub.grafik = { mode: 'bulan', tahun: String(kini.getFullYear()), bulan: kini.getMonth() + 1 });
  box.innerHTML = '<h2 class="font-bold">Pemasukan &amp; Pengeluaran RT</h2>' + loadingHtml().replace('py-16', 'py-10');
  call('kas.grafik', g).then(function (d) { S.data.grafik = d; gambarGrafik(); })
    .catch(function (e) { box.innerHTML = '<h2 class="font-bold">Pemasukan &amp; Pengeluaran RT</h2><p class="text-sm text-red-700 mt-2">' + h(e.message) + '</p>'; });
}

function grafikKe(mode, tahun, bulan) {
  var g = S.sub.grafik;
  g.mode = mode;
  if (tahun) g.tahun = String(tahun);
  if (bulan) g.bulan = Number(bulan);
  muatGrafik();
}

function gambarGrafik() {
  var box = document.getElementById('grafik-kas'), d = S.data.grafik;
  if (!box || !d) return;
  var mode = d.mode;
  var tab = function (m, l) { return '<button class="tab !py-1 !px-3 !text-xs ' + (mode === m ? 'on' : '') + '" onclick="grafikKe(\'' + m + '\')">' + l + '</button>'; };
  var nav = '';
  if (mode !== 'tahun') nav += '<select class="inp !w-auto !min-h-[34px] !py-0 !text-sm" onchange="grafikKe(\'' + mode + '\', this.value)">' + opsiSelect(d.tahunList.indexOf(d.tahun) < 0 ? d.tahunList.concat([d.tahun]) : d.tahunList, d.tahun) + '</select>';
  if (mode === 'minggu') nav += '<select class="inp !w-auto !min-h-[34px] !py-0 !text-sm" onchange="grafikKe(\'minggu\', null, this.value)">' + opsiSelect(BULAN.map(function (b, i) { return [String(i + 1), b]; }), String(Number(d.bulan))) + '</select>';
  var judulPeriode = mode === 'tahun' ? 'Per tahun' : (mode === 'bulan' ? 'Per bulan, tahun ' + d.tahun : 'Per minggu, ' + d.namaBulan + ' ' + d.tahun);
  var selisih = d.total.masuk - d.total.keluar;
  var legend = function (warna, label, nilai) {
    return '<div class="flex items-center gap-2 min-w-0"><span class="w-3 h-3 rounded-sm shrink-0" style="background:' + warna + '"></span><div class="min-w-0"><div class="text-[11px] text-slate-500 leading-none">' + label + '</div><div class="font-bold text-sm text-slate-800 whitespace-nowrap">' + rp(nilai) + '</div></div></div>';
  };
  var W = Math.max(box.clientWidth - 32, 260), H = 200, kiri = 46, bawah = 22, atas = 8;
  var n = d.data.length, slot = (W - kiri) / n, bw = Math.max(4, Math.min(24, (slot - 10) / 2));
  var maks = d.data.reduce(function (m, x) { return Math.max(m, x.masuk, x.keluar); }, 0);
  var sk = skalaRapi(maks), tinggi = H - atas - bawah;
  var y = function (v) { return atas + tinggi - (v / sk.maks) * tinggi; };
  var batang = function (x, v, warna) {
    if (v <= 0) return '';
    var y0 = atas + tinggi, y1 = y(v), hgt = y0 - y1, r = Math.min(4, hgt, bw / 2);
    return '<path d="M' + x + ',' + y0 + 'V' + (y1 + r) + 'Q' + x + ',' + y1 + ' ' + (x + r) + ',' + y1 + 'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + y1 + ' ' + (x + bw) + ',' + (y1 + r) + 'V' + y0 + 'Z" fill="' + warna + '"/>';
  };
  var svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Grafik pemasukan dan pengeluaran ' + h(judulPeriode) + '" style="display:block;max-width:100%">';
  for (var t = 0; t <= sk.maks + 0.5; t += sk.step) {
    var yy = Math.round(y(t)) + 0.5;
    svg += '<line x1="' + kiri + '" x2="' + W + '" y1="' + yy + '" y2="' + yy + '" stroke="' + (t === 0 ? '#cbd5e1' : '#eef2f1') + '" stroke-width="1"/>' +
      '<text x="' + (kiri - 6) + '" y="' + (yy + 3.5) + '" text-anchor="end" font-size="10" fill="#64748b">' + rpPendek(t) + '</text>';
  }
  d.data.forEach(function (x, i) {
    var cx = kiri + slot * i + slot / 2;
    svg += batang(cx - 1 - bw, x.masuk, WARNA_MASUK) + batang(cx + 1, x.keluar, WARNA_KELUAR) +
      '<text x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="#475569">' + h(x.label) + '</text>' +
      '<rect class="hit" data-i="' + i + '" x="' + (kiri + slot * i) + '" y="' + atas + '" width="' + slot + '" height="' + (tinggi + bawah) + '" fill="transparent" style="cursor:pointer"/>';
  });
  svg += '<rect id="g-sorot" x="0" y="' + atas + '" width="0" height="' + tinggi + '" fill="#0f172a" opacity="0.04" pointer-events="none"/></svg>';
  var kosongData = !d.total.masuk && !d.total.keluar;
  box.innerHTML = '<div class="flex flex-wrap items-start justify-between gap-2"><div><h2 class="font-bold">Pemasukan &amp; Pengeluaran RT</h2><div class="text-xs text-slate-500">' + h(judulPeriode) + '</div></div>' +
    '<div class="flex gap-1">' + tab('tahun', 'Tahunan') + tab('bulan', 'Bulanan') + tab('minggu', 'Mingguan') + '</div></div>' +
    (nav ? '<div class="flex flex-wrap gap-2 mt-3">' + nav + '</div>' : '') +
    '<div class="flex flex-wrap gap-x-5 gap-y-2 mt-3">' + legend(WARNA_MASUK, 'Pemasukan', d.total.masuk) + legend(WARNA_KELUAR, 'Pengeluaran', d.total.keluar) +
    '<div class="min-w-0 pl-5"><div class="text-[11px] text-slate-500 leading-none">Selisih</div><div class="font-bold text-sm whitespace-nowrap ' + (selisih < 0 ? 'text-rose-700' : 'text-slate-800') + '">' + (selisih < 0 ? '&minus;' : '') + rp(Math.abs(selisih)) + '</div></div></div>' +
    '<div class="mt-3 relative" id="g-area">' + svg + (kosongData ? '<div class="absolute inset-0 flex items-center justify-center text-sm text-slate-400 pointer-events-none">Belum ada transaksi pada periode ini</div>' : '') +
    '<div id="g-tip" class="hidden absolute z-10 bg-white border rounded-xl shadow-lg p-3 text-xs w-60"></div></div>' +
    '<p class="text-[11px] text-slate-400 mt-1">' + (mode === 'minggu' ? 'Ketuk batang untuk melihat rincian.' : 'Ketuk batang untuk melihat rincian &amp; turun ke ' + (mode === 'tahun' ? 'bulanan' : 'mingguan') + '.') + '</p>' +
    '<details class="mt-2"><summary class="text-xs font-semibold text-emerald-700 cursor-pointer">Lihat tabel</summary><div class="overflow-x-auto mt-2"><table class="w-full text-xs whitespace-nowrap"><thead><tr class="text-left text-slate-500 border-b"><th class="py-1.5 pr-2">Periode</th><th class="py-1.5 pr-2 text-right">Pemasukan</th><th class="py-1.5 pr-2 text-right">Pengeluaran</th><th class="py-1.5 text-right">Selisih</th></tr></thead><tbody>' +
    d.data.map(function (x) { var s2 = x.masuk - x.keluar; return '<tr class="border-b last:border-0"><td class="py-1.5 pr-2">' + h(x.panjang) + '</td><td class="py-1.5 pr-2 text-right">' + rp(x.masuk) + '</td><td class="py-1.5 pr-2 text-right">' + rp(x.keluar) + '</td><td class="py-1.5 text-right ' + (s2 < 0 ? 'text-rose-700' : '') + '">' + (s2 < 0 ? '&minus;' : '') + rp(Math.abs(s2)) + '</td></tr>'; }).join('') +
    '</tbody></table></div></details>';
  var tip = document.getElementById('g-tip'), sorot = document.getElementById('g-sorot'), area = document.getElementById('g-area');
  var tampilTip = function (i) {
    var x = d.data[i], s2 = x.masuk - x.keluar;
    var turun = mode === 'tahun' ? '<button class="btn btn-s btn-sm w-full mt-2" onclick="grafikKe(\'bulan\', \'' + x.key + '\')">Lihat per bulan &rsaquo;</button>' :
      (mode === 'bulan' ? '<button class="btn btn-s btn-sm w-full mt-2" onclick="grafikKe(\'minggu\', \'' + x.key.slice(0, 4) + '\', \'' + Number(x.key.slice(5, 7)) + '\')">Lihat per minggu &rsaquo;</button>' : '');
    tip.innerHTML = '<div class="font-bold text-slate-800 mb-1">' + h(x.panjang) + '</div>' +
      '<div class="flex justify-between gap-2"><span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm" style="background:' + WARNA_MASUK + '"></span>Pemasukan</span><b class="whitespace-nowrap">' + rp(x.masuk) + '</b></div>' +
      '<div class="flex justify-between gap-2"><span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm" style="background:' + WARNA_KELUAR + '"></span>Pengeluaran</span><b class="whitespace-nowrap">' + rp(x.keluar) + '</b></div>' +
      '<div class="flex justify-between gap-2 border-t mt-1 pt-1"><span>Selisih</span><b class="whitespace-nowrap ' + (s2 < 0 ? 'text-rose-700' : '') + '">' + (s2 < 0 ? '&minus;' : '') + rp(Math.abs(s2)) + '</b></div>' + turun;
    tip.classList.remove('hidden');
    var cx = kiri + slot * i + slot / 2, lebar = tip.offsetWidth;
    var kiriTip = Math.min(Math.max(cx - lebar / 2, 0), area.clientWidth - lebar);
    tip.style.left = kiriTip + 'px'; tip.style.top = '-6px';
    tip.style.transform = 'translateY(-100%)';
    sorot.setAttribute('x', kiri + slot * i); sorot.setAttribute('width', slot);
  };
  var tutupTip = function () { tip.classList.add('hidden'); sorot.setAttribute('width', 0); };
  Array.prototype.forEach.call(box.querySelectorAll('.hit'), function (r) {
    var i = Number(r.getAttribute('data-i'));
    r.addEventListener('mouseenter', function () { tampilTip(i); });
    r.addEventListener('click', function (e) { e.stopPropagation(); tampilTip(i); });
  });
  area.addEventListener('mouseleave', function () { if (!('ontouchstart' in window)) tutupTip(); });
  if (!gambarGrafik.pasang) {
    gambarGrafik.pasang = true;
    document.addEventListener('click', function (e) { var t2 = document.getElementById('g-tip'); if (t2 && !t2.contains(e.target)) { t2.classList.add('hidden'); var so = document.getElementById('g-sorot'); if (so) so.setAttribute('width', 0); } });
    var tunda = null;
    window.addEventListener('resize', function () { clearTimeout(tunda); tunda = setTimeout(gambarGrafik, 200); });
  }
}

              return '<td class="p-1 text-center"><span class="cell ' + (i <= bulanIni && d.tahun <= String(new Date().getFullYear()) ? 'bg-red-50 text-red-300' : 'bg-slate-50 text-slate-300') + '">&ndash;</span></td>';
            }).join('') + '</tr>';

        (can(ADMIN_KAS) ? '<p class="text-xs text-slate-500 mt-2">Ketuk kotak hijau untuk membatalkan pembayaran yang salah catat.</p>' : '');
    }).catch(function (e) { gagal(el, e); });
  }
};

function formBayar(uid) {

  var daftarTh = [];
  for (var y = Math.min(thIni - 1, Number(d.tahun)); y <= Math.max(thIni + 1, Number(d.tahun)); y++) daftarTh.push(String(y));
  openModal('Catat Pembayaran IPL', '<form id="f-bayar" onsubmit="return false"><div class="rounded-xl bg-slate-50 p-3"><div class="font-bold">' + h(w.nama) + '</div><div class="text-xs text-slate-500">' + h(w.no_rumah) + ' &middot; ' + h(w.gang) + '</div></div>' +
    '<label class="lbl">Pilih bulan yang dibayar <span class="font-normal text-slate-500">(boleh lintas tahun)</span></label>' +
    '<div class="flex flex-wrap gap-1 mb-2" id="th-bayar"></div>' +
    '<div id="grid-bayar">' + loadingHtml() + '</div>' +
    '<div class="flex flex-wrap gap-2 mt-2"><button type="button" class="btn btn-s btn-sm" id="b-semua-th"><i class="fa-solid fa-check-double"></i> Semua bulan tahun ini</button>' +
    '<button type="button" class="btn btn-s btn-sm" id="b-kosong"><i class="fa-solid fa-eraser"></i> Kosongkan</button></div>' +
    '<label class="lbl">Atau lunasi sampai bulan</label><div class="flex gap-2"><input type="month" class="inp" id="sd-bulan" min="' + daftarTh[0] + '-01"><button type="button" class="btn btn-s" id="b-sd">Pilih</button></div>' +
    '<p class="text-[11px] text-slate-500 mt-1">Memilih semua bulan yang belum lunas sejak awal IPL berlaku (Pengaturan) sampai bulan tersebut.</p>' +
    '<label class="lbl">Nominal per bulan (Rp)</label><input class="inp" name="nominal" inputmode="numeric" value="' + d.nominal + '">' +
    '<label class="lbl">Bentuk pembayaran</label><div class="grid grid-cols-2 gap-2">' + ['Tunai', 'Transfer'].map(function (j, i) { return '<label class="rounded-xl border p-3 text-center font-semibold cursor-pointer has-[:checked]:bg-emerald-700 has-[:checked]:text-white"><input type="radio" class="hidden" name="metode" value="' + j + '"' + (i === 0 ? ' checked' : '') + '>' + j + '</label>'; }).join('') + '</div>' +
    '<label class="lbl">Catatan (opsional)</label><input class="inp" name="catatan" placeholder="mis. titip lewat istri">' +
    '<div id="tot" class="mt-3 text-sm text-slate-600"></div>' +
    '<button class="btn btn-p w-full mt-4" id="b-bayar"><i class="fa-solid fa-floppy-disk"></i> Simpan Pembayaran</button></form>');
  var f = document.getElementById('f-bayar');
  var aktif = d.tahun, mulai = d.mulai || '';
  var lunasMap = {};
  var tabTahun = function () {
    document.getElementById('th-bayar').innerHTML = daftarTh.map(function (t) { return '<button type="button" class="tab' + (t === aktif ? ' on' : '') + '" data-th="' + t + '">' + t + '<span class="ml-1 text-[10px]" id="n-' + t + '"></span></button>'; }).join('') +
      '<button type="button" class="tab" data-tambah="1" aria-label="Tambah tahun berikutnya"><i class="fa-solid fa-plus"></i> ' + (Number(daftarTh[daftarTh.length - 1]) + 1) + '</button>';
  };
  var buatGrid = function (t) {
    return '<div data-grid="' + t + '" class="grid grid-cols-4 gap-2' + (t === aktif ? '' : ' hidden') + '">' + BLN.map(function (b, i) {
      var per = t + '-' + ('0' + (i + 1)).slice(-2);
      var lunas = !!lunasMap[per];
      return '<label class="flex items-center justify-center gap-1 rounded-xl border p-2.5 text-sm ' + (lunas ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'cursor-pointer has-[:checked]:bg-emerald-600 has-[:checked]:text-white') + '">' +
        (lunas ? '<i class="fa-solid fa-check"></i>' : '<input type="checkbox" class="hidden" name="periode" data-multi="1" value="' + per + '">') + b + '</label>';
    }).join('') + '</div>';
  };
  var tambahSampai = function (tAkhir) {
    var g = document.getElementById('grid-bayar');
    while (Number(daftarTh[daftarTh.length - 1]) < Number(tAkhir)) {
      var t = String(Number(daftarTh[daftarTh.length - 1]) + 1);
      daftarTh.push(t);
      g.insertAdjacentHTML('beforeend', buatGrid(t));
    }
  };
  var tampil = function (t) {
    aktif = t;
    Array.prototype.forEach.call(document.querySelectorAll('#grid-bayar [data-grid]'), function (g) { g.classList.toggle('hidden', g.dataset.grid !== t); });
    tabTahun(); hitung();
  };
  var kotakBelum = function (t) { return Array.prototype.slice.call(f.querySelectorAll('input[name=periode]')).filter(function (c) { return !t || c.value.slice(0, 4) === t; }); };
  var hitung = function () {
    var o = formData('f-bayar'), per = {};
    o.periode.forEach(function (x) { per[x.slice(0, 4)] = (per[x.slice(0, 4)] || 0) + 1; });
    daftarTh.forEach(function (t) { var n = document.getElementById('n-' + t); if (n) n.textContent = per[t] ? '(' + per[t] + ')' : ''; });
    document.getElementById('tot').innerHTML = o.periode.length ? 'Total diterima: <b>' + rp(o.periode.length * Number(o.nominal || 0)) + '</b> (' + o.periode.length + ' bulan: ' +
      Object.keys(per).sort().map(function (t) { return t + ' = ' + per[t]; }).join(', ') + ')<div class="text-xs text-slate-500">' + h(ringkasPeriode(o.periode)) + '</div>' : '';
  };
  tabTahun();
  call('ipl.matrix', { tahun: d.tahun, gang: w.gang, semuaTahun: 1 }).then(function (m) {
    var w2 = m.warga.filter(function (x) { return x.id === uid; })[0] || w;
    lunasMap = w2.bayar || {};
    mulai = m.mulai || mulai;
    var akhirLunas = Object.keys(lunasMap).sort().pop();
    if (akhirLunas && Number(akhirLunas.slice(0, 4)) + 1 > Number(daftarTh[daftarTh.length - 1])) {
      for (var y2 = Number(daftarTh[daftarTh.length - 1]) + 1; y2 <= Number(akhirLunas.slice(0, 4)) + 1; y2++) daftarTh.push(String(y2));
    }
    document.getElementById('grid-bayar').innerHTML = daftarTh.map(buatGrid).join('');
    tabTahun(); hitung();
  }).catch(function (e) { document.getElementById('grid-bayar').innerHTML = '<p class="text-sm text-red-600">' + h(e.message) + '</p>'; });
  document.getElementById('th-bayar').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.tambah) { var t = String(Number(daftarTh[daftarTh.length - 1]) + 1); tambahSampai(t); tampil(t); return; }
    tampil(b.dataset.th);
  };
  document.getElementById('b-semua-th').onclick = function () { kotakBelum(aktif).forEach(function (c) { c.checked = true; }); hitung(); };
  document.getElementById('b-kosong').onclick = function () { kotakBelum('').forEach(function (c) { c.checked = false; }); hitung(); };
  document.getElementById('b-sd').onclick = function () {
    var sd = document.getElementById('sd-bulan').value;
    if (!sd) { toast('Pilih bulan terakhir yang dibayar.', 'err'); return; }
    tambahSampai(sd.slice(0, 4));
    kotakBelum('').forEach(function (c) { c.checked = c.value >= mulai && c.value <= sd; });
    tampil(sd.slice(0, 4));
  };
  f.addEventListener('change', hitung); f.addEventListener('input', hitung);
  document.getElementById('b-bayar').onclick = function () {
    var o = formData('f-bayar'); o.user_id = uid;
    kirim(this, 'ipl.bayar', o, function (r) { toast('Tercatat ' + r.dicatat.length + ' bulan. Kuitansi ' + r.kuitansi + ' siap dikirim.'); refresh(); bukaKuitansi({ no: r.kuitansi }); });
  };
}

function ringkasPeriode(periode) {
  var NM = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
  var per = {}, hasil = [], awal = null, akhir = null;
  periode.slice().sort().forEach(function (p) { var t = p.slice(0, 4); (per[t] = per[t] || []).push(Number(p.slice(5, 7))); });
  var tutup = function () { if (awal) hasil.push((awal === akhir ? awal : awal + '–' + akhir) + ': Jan–Des'); awal = akhir = null; };
  Object.keys(per).sort().forEach(function (t) {
    var b = per[t], bag = [], i = 0;
    if (b.length === 12) { if (akhir && Number(t) === Number(akhir) + 1) akhir = t; else { tutup(); awal = akhir = t; } return; }
    tutup();
    while (i < b.length) {
      var j = i;
      while (j + 1 < b.length && b[j + 1] === b[j] + 1) j++;
      bag.push(j > i ? NM[b[i] - 1] + '–' + NM[b[j] - 1] : NM[b[i] - 1]);
      i = j + 1;
    }
    hasil.push(t + ': ' + bag.join(', '));
  });
  tutup();
  return hasil.join(' · ');
}

}

function kawinSurat(st) {
  if (st === 'Belum Kawin' || st === 'Kawin') return st;
  if (/cerai|duda|janda/i.test(String(st || ''))) return 'Duda / Janda';
  return '';
}

function bukaSurat(id, mode) {
  openModal('Surat Pengantar', loadingHtml() + '<p class="text-center text-sm text-slate-500 -mt-10 pb-6">' + (mode === 'unduh' ? 'Membuat file PDF...' : 'Menyiapkan dokumen...') + '</p>', { lebar: true });
  call('surat.dokumen', { id: id, tanpaPdf: mode !== 'unduh' }).then(function (d) {
    S.data.dok = d;
    if (mode === 'unduh' && d.pdf) unduhPdf(d);
    var body = document.getElementById('modal-body');
    if (!body) return;
    body.innerHTML = (d.draf ? '<div class="rounded-lg bg-amber-50 text-amber-800 text-sm p-2.5 mb-3"><i class="fa-solid fa-triangle-exclamation"></i> Pratinjau DRAF &mdash; surat belum disetujui.</div>' : '') +
      '<div class="flex flex-wrap gap-2 mb-3">' + (d.draf ? '' : '<button class="btn btn-p btn-sm" id="b-unduh"><i class="fa-solid fa-file-arrow-down"></i> Unduh PDF</button>') +
      '<button class="btn btn-s btn-sm" onclick="cetakSurat()"><i class="fa-solid fa-print"></i> Cetak</button></div>' +
      '<div class="a4box" id="a4box"><iframe id="a4frame" title="Pratinjau surat"></iframe></div>' +
      '<p class="text-xs text-slate-500 mt-3"><i class="fa-solid fa-stamp"></i> Cetak di kertas ' + (S.cfg.UKURAN_KERTAS === 'A4' ? 'A4' : 'F4 / Folio') + ', lalu mintakan tanda tangan &amp; stempel basah Ketua RT ' + h(S.cfg.RT) + ' (dan Ketua RW ' + h(S.cfg.RW) + ' bila diperlukan).</p>';
    var fr = document.getElementById('a4frame');
    fr.srcdoc = d.html;
    var kertas = S.cfg.UKURAN_KERTAS === 'A4' ? [794, 1123] : [813, 1247];
    fr.style.width = kertas[0] + 'px'; fr.style.height = kertas[1] + 'px';
    var skala = function () { var box = document.getElementById('a4box'); if (!box) return; var s = box.clientWidth / kertas[0]; fr.style.transform = 'scale(' + s + ')'; box.style.height = (kertas[1] * s) + 'px'; };
    skala();
    window.onresize = skala;
    var bu = document.getElementById('b-unduh');
    if (bu) bu.onclick = function () {
      if (S.data.dok.pdf) { unduhPdf(S.data.dok); return; }
      kirim(this, 'surat.dokumen', { id: id }, function (x) { S.data.dok = x; unduhPdf(x); });
    };
  }).catch(function (e) { closeModal(); toast(e.message, 'err'); });
}

function unduhPdf(d) {
  if (!d.pdf) { toast('PDF tidak tersedia, gunakan tombol Cetak lalu pilih Simpan sebagai PDF.', 'err'); return; }
  try {
    var bin = atob(d.pdf), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
    var a = document.createElement('a');
    a.href = url; a.download = d.filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    toast('PDF diunduh: ' + d.filename);
  } catch (e) { toast('Gagal mengunduh. Gunakan tombol Cetak lalu pilih Simpan sebagai PDF.', 'err'); }
}

function cetakSurat() {
  var fr = document.getElementById('a4frame');
  try { fr.contentWindow.focus(); fr.contentWindow.print(); }
  catch (e) { toast('Browser memblokir cetak. Gunakan tombol Unduh PDF.', 'err'); }
}

function formPinjam(id) {
  var a = (S.data.aset || []).filter(function (x) { return x.id === id; })[0] || S.data.asetDetail;
  var besok = hariIni();
  openModal('Pinjam ' + a.nama, '<form id="f-pinjam" onsubmit="return false">' +
    '<div class="grid grid-cols-2 gap-3"><div><label class="lbl">Tanggal pinjam</label><input class="inp" type="date" name="tgl_pinjam" min="' + besok + '" value="' + besok + '"></div><div><label class="lbl">Tanggal kembali</label><input class="inp" type="date" name="tgl_kembali" min="' + besok + '" value="' + besok + '"></div></div>' +
    '<label class="lbl">Jumlah unit</label><div class="flex items-center gap-2"><button type="button" class="btn btn-s w-12" id="jml-min">&minus;</button><input class="inp text-center" name="jumlah" inputmode="numeric" value="1"><button type="button" class="btn btn-s w-12" id="jml-plus">+</button></div>' +
    '<div id="stok-info" class="mt-3 rounded-xl p-3 bg-slate-50 text-sm">' + loadingHtml().replace('py-16', 'py-2') + '</div>' +
    '<label class="lbl">Keperluan</label><input class="inp" name="keperluan" placeholder="mis. acara syukuran / tahlilan">' +
    '<button class="btn btn-p w-full mt-5" id="b-pinjam"><i class="fa-solid fa-paper-plane"></i> Ajukan Peminjaman</button>' +
    '<p class="text-xs text-slate-500 mt-2 text-center">Pengajuan disetujui oleh Ketua RT / Super Admin.</p>' +
    '<h4 class="font-bold text-sm mt-5 mb-1"><i class="fa-regular fa-calendar"></i> Jadwal pemakaian ' + h(a.nama) + '</h4><div id="jadwal-info"></div></form>');
  var f = document.getElementById('f-pinjam');
  var btn = document.getElementById('b-pinjam');
  var stok = null, timer = null, urut = 0;
  var tampil = function () {
    var o = formData('f-pinjam');
    var jml = Number(o.jumlah) || 0;
    var info = document.getElementById('stok-info');
    if (!stok) return;
    var cukup = jml >= 1 && jml <= stok.tersedia;
    info.className = 'mt-3 rounded-xl p-3 text-sm ' + (cukup ? 'bg-emerald-50 text-emerald-900' : 'bg-red-50 text-red-800');
    info.innerHTML = '<div class="flex items-center justify-between gap-2"><div><div class="font-bold">' + (stok.tersedia ? 'Tersedia ' + stok.tersedia + ' dari ' + stok.jumlah + ' unit' : 'Stok habis pada tanggal ini') + '</div>' +
      '<div class="text-xs opacity-80">' + tglPendek(o.tgl_pinjam) + (o.tgl_kembali !== o.tgl_pinjam ? ' &ndash; ' + tglPendek(o.tgl_kembali) : '') + (stok.dipakai ? ' &middot; ' + stok.dipakai + ' unit sudah terjadwal dipinjam' : '') + '</div></div>' +
      '<i class="fa-solid ' + (cukup ? 'fa-circle-check text-emerald-600' : 'fa-circle-xmark text-red-600') + ' text-2xl"></i></div>' +
      (stok.menunggu ? '<div class="text-xs mt-1 text-amber-800"><i class="fa-solid fa-hourglass-half"></i> ' + stok.menunggu + ' unit sedang diajukan warga lain (belum disetujui).</div>' : '') +
      (!cukup && jml > stok.tersedia && stok.tersedia ? '<div class="text-xs mt-1">Kurangi jumlah menjadi maksimal ' + stok.tersedia + ' atau pilih tanggal lain.</div>' : '');
    btn.disabled = !cukup;
    btn.style.opacity = cukup ? '' : '.5';
  };
  var cek = function () {
    var o = formData('f-pinjam');
    if (o.tgl_kembali < o.tgl_pinjam) { f.tgl_kembali.value = o.tgl_pinjam; o.tgl_kembali = o.tgl_pinjam; }
    f.tgl_kembali.min = o.tgl_pinjam;
    var ke = ++urut;
    call('aset.cek', { aset_id: id, tgl_pinjam: o.tgl_pinjam, tgl_kembali: o.tgl_kembali }).then(function (r) {
      if (ke !== urut || !document.getElementById('stok-info')) return;
      stok = r; tampil();
      document.getElementById('jadwal-info').innerHTML = jadwalHtml(r.jadwal);
    }).catch(function (e) {
      var info = document.getElementById('stok-info');
      if (info) { info.className = 'mt-3 rounded-xl p-3 text-sm bg-red-50 text-red-800'; info.textContent = e.message; }
      btn.disabled = true; btn.style.opacity = '.5';
    });
  };
  f.tgl_pinjam.onchange = cek; f.tgl_kembali.onchange = cek;
  f.jumlah.oninput = tampil;
  document.getElementById('jml-min').onclick = function () { f.jumlah.value = Math.max(1, (Number(f.jumlah.value) || 1) - 1); tampil(); };
  document.getElementById('jml-plus').onclick = function () { f.jumlah.value = (Number(f.jumlah.value) || 0) + 1; tampil(); };
  cek();
  btn.onclick = function () { var o = formData('f-pinjam'); o.aset_id = id; kirim(this, 'pinjam.ajukan', o, function () { closeModal(); S.sub.aset = 'pinjam'; toast('Pengajuan terkirim. Tunggu persetujuan Ketua RT.'); refresh(); }); };
}

            (s.lihatHasil ? '<div class="mt-3"><div class="flex justify-between text-sm"><span>' + k.suara + ' suara</span><b>' + pct + '%</b></div><div class="h-2.5 bg-slate-100 rounded-full overflow-hidden mt-1"><div class="h-full bg-emerald-600" style="width:' + pct + '%"></div></div></div>' : '') +
            (s.status === 'buka' && s.bisaMemilih && !s.sudahMemilih ? '<button class="btn btn-p w-full mt-3" onclick="pilih(\'' + s.id + '\',\'' + k.id + '\')"><i class="fa-solid fa-check-to-slot"></i> Pilih No. ' + k.no_urut + '</button>' : '') +

        }).join('') + '</div>' : '<p class="text-sm text-slate-400 mt-3">Belum ada kandidat.</p>';
        var info = s.status === 'buka' ? (s.sudahMemilih ? '<div class="rounded-xl bg-emerald-50 text-emerald-800 p-3 text-sm mt-3"><i class="fa-solid fa-circle-check"></i> Keluarga Anda sudah menggunakan hak suara. Terima kasih!</div>' :
          (!s.bisaMemilih ? '<div class="rounded-xl bg-amber-50 text-amber-800 p-3 text-sm mt-3"><i class="fa-solid fa-id-card"></i> Anda belum memiliki hak suara karena <b>No. KK belum terdaftar</b> di sistem. Daftarkan KK Anda di menu Data Keluarga atau hubungi pengurus RT. <button class="underline font-semibold" onclick="go(\'kk\')">Buka Data Keluarga</button></div>' : '')) : '';
        return '<section class="card p-4"><div class="flex items-start justify-between gap-2"><div class="min-w-0"><h2 class="font-bold text-lg">' + h(s.judul) + '</h2><p class="text-sm text-slate-500 pre">' + h(s.keterangan) + '</p></div>' + chip(s.status) + '</div>' +
          '<div class="text-xs text-slate-500 mt-2"><i class="fa-solid fa-house"></i> Partisipasi: <b>' + s.partisipasi + '</b> dari ' + s.totalRumah + ' keluarga' + (s.lihatHasil && s.status !== 'tutup' ? ' &middot; <span class="text-amber-700">hasil sementara (hanya Super Admin)</span>' : '') + '</div>' +
          info + kand +
          (sa ? '<div class="flex flex-wrap gap-2 mt-4 pt-3 border-t">' + (s.status === 'draf' ? '<button class="btn btn-s btn-sm" onclick="formKandidat(\'' + s.id + '\')"><i class="fa-solid fa-user-plus"></i> Kandidat</button>' : '') +
            '<button class="btn btn-s btn-sm" onclick="formSesi(\'' + s.id + '\')"><i class="fa-solid fa-gear"></i> Atur Sesi</button></div>' : '') + '</section>';
      }).join('') + '</div>' : kosong('fa-check-to-slot', 'Belum ada pemilihan.'));
  }).catch(function (e) { gagal(el, e); });
};

function pilih(sid, kid) {
  var s = S.data.vote.filter(function (x) { return x.id === sid; })[0];
  var k = s.kandidat.filter(function (x) { return x.id === kid; })[0];
  konfirmasi('Anda memilih No. ' + k.no_urut + ' - ' + k.nama + ' atas nama ' + (S.user.no_kk ? 'keluarga (KK) Anda' : 'rumah ' + S.user.no_rumah) + '. Satu KK hanya satu suara dan pilihan tidak dapat diubah. Lanjutkan?', 'Ya, kirim suara', function (b) {
    kirim(b, 'vote.pilih', { sesi_id: sid, kandidat_id: kid }, function () { closeModal(); toast('Suara Anda tercatat. Terima kasih!'); refresh(); });
  });
}

function formSesi(id) {
  var s = id ? S.data.vote.filter(function (x) { return x.id === id; })[0] : { status: 'draf' };
  openModal(id ? 'Atur Sesi Pemilihan' : 'Sesi Pemilihan Baru', '<form id="f-sesi" onsubmit="return false"><label class="lbl">Judul</label><input class="inp" name="judul" value="' + h(s.judul || 'Pemilihan Ketua RT ' + S.cfg.RT + ' Periode ...') + '">' +
    '<label class="lbl">Keterangan</label><textarea class="inp" name="keterangan">' + h(s.keterangan || '') + '</textarea>' +
    '<label class="lbl">Status</label><select class="inp" name="status">' + opsiSelect([['draf', 'Draf (siapkan kandidat)'], ['buka', 'Dibuka (warga bisa memilih)'], ['tutup', 'Ditutup (hasil diumumkan)']], s.status) + '</select>' +
    '<p class="text-xs text-slate-500 mt-2">Kandidat hanya bisa diubah saat draf. Sesi yang sudah ditutup tidak bisa dibuka kembali.</p>' +
    '<div class="flex gap-2 mt-5">' + (id && s.status === 'draf' ? '<button class="btn btn-d" id="b-hapus"><i class="fa-solid fa-trash"></i></button>' : '') + '<button class="btn btn-p flex-1" id="b-sesi">Simpan</button></div></form>');
  document.getElementById('b-sesi').onclick = function () { var o = formData('f-sesi'); o.id = id || ''; kirim(this, 'vote.sesiSimpan', o, function () { closeModal(); toast('Sesi tersimpan.'); refresh(); }); };
  var bh = document.getElementById('b-hapus');
  if (bh) bh.onclick = function () { konfirmasi('Hapus sesi ini beserta kandidatnya?', 'Hapus', function (b) { kirim(b, 'vote.sesiHapus', { id: id }, function () { closeModal(); toast('Dihapus.'); refresh(); }); }); };
}

function formVisiMisi(sid, kid) {
  var s = S.data.vote.filter(function (x) { return x.id === sid; })[0];
  var k = s.kandidat.filter(function (x) { return x.id === kid; })[0];
  openModal('Visi & Misi Calon No. ' + k.no_urut, '<form id="f-vm" onsubmit="return false"><div class="rounded-xl bg-slate-50 p-3 font-bold">' + h(k.nama) + '</div>' +
    '<label class="lbl">Visi &amp; misi</label><textarea class="inp" name="visi_misi" style="min-height:180px" placeholder="Visi: ...&#10;Misi:&#10;1. ...&#10;2. ...">' + h(k.visi_misi || '') + '</textarea>' +
    '<p class="text-xs text-slate-500 mt-1">Pemilihan sedang berjalan: hanya visi &amp; misi yang bisa diubah. Tampil untuk semua warga, termasuk di beranda publik.</p>' +
    '<button class="btn btn-p w-full mt-5" id="b-vm"><i class="fa-solid fa-floppy-disk"></i> Simpan</button></form>');

    var o = formData('f-vm'); o.id = kid; o.sesi_id = sid; o.hanyaVisi = true; o.nama = k.nama;
    kirim(this, 'vote.kandidatSimpan', o, function () { closeModal(); toast('Visi & misi tersimpan.'); refresh(); });
  };
}

function formKandidat(sid, kid) {
  var s = S.data.vote.filter(function (x) { return x.id === sid; })[0];
  var k = kid ? s.kandidat.filter(function (x) { return x.id === kid; })[0] : { no_urut: s.kandidat.length + 1 };
  openModal(kid ? 'Ubah Kandidat' : 'Tambah Kandidat', '<form id="f-kd" onsubmit="return false"><div class="grid grid-cols-4 gap-3"><div><label class="lbl">No.</label><input class="inp" name="no_urut" inputmode="numeric" value="' + h(k.no_urut) + '"></div>' +
    '<div class="col-span-3"><label class="lbl">Nama calon</label><input class="inp" name="nama" value="' + h(k.nama || '') + '"></div></div>' +
    fotoPicker('fotoKd', k.foto, 'Foto kandidat') +
    '<label class="lbl">Visi &amp; misi</label><textarea class="inp" name="visi_misi" style="min-height:140px">' + h(k.visi_misi || '') + '</textarea>' +
    '<div class="flex gap-2 mt-5">' + (kid ? '<button class="btn btn-d" id="b-hapus"><i class="fa-solid fa-trash"></i></button>' : '') + '<button class="btn btn-p flex-1" id="b-kd">Simpan</button></div></form>');
  pasangFoto('fotoKd', 400);
  document.getElementById('b-kd').onclick = function () { var o = formData('f-kd'); o.id = kid || ''; o.sesi_id = sid; o.foto = S.data.fotoKd; kirim(this, 'vote.kandidatSimpan', o, function () { closeModal(); toast('Kandidat tersimpan.'); refresh(); }); };
  if (kid) document.getElementById('b-hapus').onclick = function () { konfirmasi('Hapus kandidat ini?', 'Hapus', function (b) { kirim(b, 'vote.kandidatHapus', { id: kid }, function () { closeModal(); toast('Dihapus.'); refresh(); }); }); };
}

VIEWS.forum = function (el) {
  if (S.sub.topik) { forumDetail(el, S.sub.topik); return; }
  call('forum.list').then(function (list) {
    el.innerHTML = judul('Diskusi Warga', 'Ruang ngobrol &amp; musyawarah warga', '<button class="btn btn-p btn-sm" onclick="formTopik()"><i class="fa-solid fa-plus"></i> Topik</button>') +
      (list.length ? '<div class="space-y-3">' + list.map(function (t) {
        return '<button class="card p-4 w-full text-left block hover:border-emerald-400" onclick="S.sub.topik=\'' + t.id + '\';refresh()"><h3 class="font-bold">' + h(t.judul) + '</h3><p class="text-sm text-slate-600 clamp2 mt-0.5">' + h(t.ringkas) + '</p>' +
          '<div class="flex items-center justify-between text-xs text-slate-500 mt-2"><span>' + h(t.penulis) + ' &middot; ' + tgl(t.dibuat) + '</span><span><i class="fa-regular fa-comment"></i> ' + t.balasan + '</span></div></button>';
      }).join('') + '</div>' : kosong('fa-comments', 'Belum ada diskusi. Mulai topik pertama!'));

function forumDetail(el, id) {

    var t = d.topik;
    var hapus = function (tipe, x) { return x.bisaHapus ? '<button class="text-xs text-red-600" onclick="hapusForum(\'' + tipe + '\',\'' + x.id + '\')"><i class="fa-solid fa-trash"></i> Hapus</button>' : ''; };
    el.innerHTML = '<button class="btn btn-s btn-sm mb-3" onclick="S.sub.topik=null;refresh()"><i class="fa-solid fa-arrow-left"></i> Semua topik</button>' +
      '<article class="card p-4"><h1 class="text-lg font-extrabold">' + h(t.judul) + '</h1><div class="text-xs text-slate-500 mt-1">' + h(t.penulis) + ' (' + h(t.jabatan) + ') &middot; ' + tgl(t.dibuat) + '</div><p class="pre mt-3">' + h(t.isi) + '</p><div class="mt-2">' + hapus('topik', t) + '</div></article>' +
      '<h2 class="font-bold mt-5 mb-2">' + d.balasan.length + ' Balasan</h2><div class="space-y-2">' + d.balasan.map(function (b) {
        return '<div class="card p-3"><div class="flex items-center justify-between gap-2"><div class="text-sm font-semibold">' + h(b.penulis) + ' <span class="text-xs font-normal text-slate-500">' + h(b.jabatan) + (b.gang ? ' &middot; ' + h(b.gang) : '') + '</span></div><div class="text-[11px] text-slate-400 shrink-0">' + tgl(b.dibuat) + '</div></div><p class="text-sm pre mt-1">' + h(b.isi) + '</p>' + (b.bisaHapus ? '<div class="mt-1">' + hapus('balasan', b) + '</div>' : '') + '</div>';
      }).join('') + '</div>' +
      '<form id="f-balas" onsubmit="return false" class="card p-3 mt-4"><textarea class="inp" name="isi" placeholder="Tulis balasan..."></textarea><button class="btn btn-p w-full mt-2" id="b-balas"><i class="fa-solid fa-reply"></i> Kirim Balasan</button></form>';
    document.getElementById('b-balas').onclick = function () { var o = formData('f-balas'); o.topik_id = id; kirim(this, 'forum.balas', o, function () { toast('Balasan terkirim.'); refresh(); }); };
  }).catch(function (e) { S.sub.topik = null; gagal(el, e); });
}

function formTopik() {
  openModal('Topik Diskusi Baru', '<form id="f-topik" onsubmit="return false"><label class="lbl">Judul</label><input class="inp" name="judul"><label class="lbl">Isi</label><textarea class="inp" name="isi" style="min-height:140px"></textarea>' +
    '<p class="text-xs text-slate-500 mt-2">Gunakan bahasa yang santun. Pengurus dapat menghapus konten yang melanggar.</p><button class="btn btn-p w-full mt-4" id="b-topik">Terbitkan</button></form>');
  document.getElementById('b-topik').onclick = function () { kirim(this, 'forum.buat', formData('f-topik'), function (r) { closeModal(); S.sub.topik = r.id; refresh(); }); };
}

function hapusForum(tipe, id) {
  konfirmasi(tipe === 'topik' ? 'Hapus topik beserta semua balasannya?' : 'Hapus balasan ini?', 'Hapus', function (b) {
    kirim(b, 'forum.hapus', { tipe: tipe === 'topik' ? 'topik' : 'balasan', id: id }, function () { closeModal(); if (tipe === 'topik') S.sub.topik = null; toast('Dihapus.'); refresh(); });
  });
}

function kkKartu(kk) {
  var ubah = kk.bisaUbah;
  var hubC = function (x) { return x === 'Kepala Keluarga' ? 'bg-emerald-100 text-emerald-800' : (x === 'Istri' || x === 'Suami' ? 'bg-sky-100 text-sky-800' : (x === 'Anak' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-700')); };
  return '<div class="rounded-2xl border bg-gradient-to-br from-emerald-50 to-white p-4"><div class="flex items-start justify-between gap-2"><div class="min-w-0">' +
    '<div class="text-[11px] text-slate-500">No. Kartu Keluarga</div><div class="font-mono font-bold text-lg tracking-wide break-all">' + h(kk.no_kk) + '</div>' +
    '<div class="font-bold mt-1">' + h(kk.kepala || '-') + '</div><div class="text-xs text-slate-500">Kepala Keluarga</div></div>' +
    (ubah ? '<button class="btn btn-s btn-sm shrink-0" onclick="formKk(\'' + kk.id + '\')"><i class="fa-solid fa-pen"></i> Ubah</button>' : '') + '</div>' +
    '<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-3 text-sm"><div><div class="text-[11px] text-slate-500">No. Rumah</div><b>' + h(kk.no_rumah) + '</b></div><div><div class="text-[11px] text-slate-500">Blok</div><b>' + h(kk.gang) + '</b></div>' +
    '<div><div class="text-[11px] text-slate-500">Status tinggal</div><b>' + h(kk.status_tinggal || '-') + '</b></div><div><div class="text-[11px] text-slate-500">Anggota</div><b>' + kk.jumlahAnggota + ' jiwa</b></div></div>' +
    (kk.alamat ? '<div class="text-xs text-slate-600 mt-2"><i class="fa-solid fa-location-dot"></i> ' + h(kk.alamat) + '</div>' : '') + '</div>' +
    '<div class="flex items-center justify-between mt-4 mb-2"><h3 class="font-bold">Anggota Keluarga</h3>' + (ubah ? '<button class="btn btn-p btn-sm" onclick="formAnggota(\'' + kk.id + '\')"><i class="fa-solid fa-user-plus"></i> Anggota</button>' : '') + '</div>' +
    (kk.anggota.length ? '<div class="space-y-2">' + kk.anggota.map(function (a) {
      return '<button class="card p-3 w-full text-left flex items-center gap-3" ' + (ubah ? 'onclick="formAnggota(\'' + kk.id + '\',\'' + a.id + '\')"' : '') + '>' +
        '<div class="w-10 h-10 rounded-full ' + (a.jk === 'Perempuan' ? 'bg-rose-100 text-rose-700' : 'bg-sky-100 text-sky-700') + ' flex items-center justify-center shrink-0"><i class="fa-solid ' + (a.umur !== '' && a.umur < 17 ? 'fa-child' : 'fa-user') + '"></i></div>' +
        '<div class="min-w-0 flex-1"><div class="font-semibold truncate">' + h(a.nama) + (a.punyaAkun ? ' <i class="fa-solid fa-mobile-screen text-emerald-600 text-xs" title="Punya akun aplikasi"></i>' : '') + '</div>' +
        '<div class="text-[11px] text-slate-500 truncate">NIK ' + h(a.nik || '-') + (a.umur !== '' ? ' &middot; ' + a.umur + ' th' : '') + (a.pekerjaan ? ' &middot; ' + h(a.pekerjaan) : '') + '</div></div>' +
        '<span class="chip ' + hubC(a.hubungan) + '">' + h(a.hubungan) + '</span></button>';
    }).join('') + '</div>' : '<p class="text-sm text-slate-400">Belum ada anggota keluarga.</p>') +
    (kk.akun && kk.akun.length ? '<div class="mt-4 text-xs text-slate-500"><i class="fa-solid fa-mobile-screen"></i> Akun aplikasi di KK ini: ' + kk.akun.map(function (x) { return h(x.nama) + (x.no_hp ? ' (' + h(x.no_hp) + ')' : ''); }).join(', ') + '</div>' : '');
}

  var pengurus = can(PENGURUS);

    '<div class="flex gap-2"><button class="btn btn-s btn-sm" onclick="formImporKk()"><i class="fa-solid fa-file-import"></i> Impor</button><button class="btn btn-p btn-sm" onclick="formKk()"><i class="fa-solid fa-plus"></i> KK</button></div>' : '') +

        '<p class="text-xs text-slate-500 mt-2">Jika No. KK keluarga Anda sudah didaftarkan anggota keluarga lain, minta pengurus RT menghubungkan akun Anda.</p></div>';
    }).catch(function (e) { gagal(el, e); });

  }

      '<div class="grid grid-cols-3 gap-2 mb-3 text-center"><div class="card p-3"><div class="text-[11px] text-slate-500">Jumlah KK</div><div class="font-extrabold text-lg">' + d.list.length + '</div></div>' +
      '<div class="card p-3"><div class="text-[11px] text-slate-500">Jumlah jiwa</div><div class="font-extrabold text-lg">' + d.jiwa + '</div></div>' +
      '<div class="card p-3"><div class="text-[11px] text-slate-500">Akun tanpa KK</div><div class="font-extrabold text-lg ' + (d.tanpaKk.length ? 'text-amber-700' : '') + '">' + d.tanpaKk.length + '</div></div></div>' +
      '<div class="flex flex-wrap gap-2 mb-3"><input class="inp flex-1 min-w-[160px] !min-h-[40px] !py-1" placeholder="Cari kepala keluarga / No. KK / rumah" value="' + h(S.sub.kkCari || '') + '" onchange="S.sub.kkCari=this.value;refresh()">' +

      (d.tanpaKk.length ? '<details class="card p-3 mb-3 bg-amber-50 border-amber-200 text-sm"><summary class="cursor-pointer font-semibold text-amber-900"><i class="fa-solid fa-user-clock"></i> ' + d.tanpaKk.length + ' akun belum terhubung ke KK</summary>' +
        '<p class="text-xs text-amber-900 mt-1">Hubungkan lewat <b>Data Warga</b> &rarr; ketuk akun &rarr; isi No. KK. Selama belum ber-KK, akun dihitung sebagai keluarga tersendiri untuk IPL &amp; e-Vote.</p>' +
        '<div class="mt-2 text-xs">' + d.tanpaKk.map(function (x) { return h(x.nama) + ' (' + h(x.no_rumah || '-') + ', ' + h(x.gang || '-') + ')'; }).join(' &middot; ') + '</div></details>' : '') +
      '<div class="card divide-y">' + (tampil.length ? tampil.map(function (k) {

          '<div class="min-w-0 flex-1"><div class="font-semibold truncate">' + h(k.kepala || '-') + '</div><div class="text-[11px] text-slate-500 truncate font-mono">' + h(k.no_kk) + '</div>' +
          '<div class="text-[11px] text-slate-500">' + h(k.no_rumah) + ' &middot; ' + h(k.gang) + ' &middot; ' + k.jumlahAnggota + ' jiwa' + (k.jumlahAkun ? ' &middot; ' + k.jumlahAkun + ' akun' : '') + '</div></div><i class="fa-solid fa-chevron-right text-slate-300"></i></button>';

function detailKk(id) {
  openModal('Kartu Keluarga', loadingHtml(), { lebar: true });
  call('kk.detail', { id: id }).then(function (kk) {
    S.data.kkAktif = kk;
    document.getElementById('modal-body').innerHTML = kkKartu(kk) +

function muatUlangKk() {

}

function formImporKk() {
  openModal('Impor Data Kartu Keluarga', '<form id="f-imkk" onsubmit="return false"><ol class="text-sm text-slate-600 list-decimal pl-5 space-y-1">' +
    '<li>Satu baris = satu orang. Kolom wajib: <b>no_kk, nik, nama, hubungan</b>. Opsional: jk, tempat_lahir, tgl_lahir, agama, pendidikan, pekerjaan, status_kawin, gol_darah, nama_ayah, nama_ibu.</li>' +

    '<li>Tempel dari Excel / Google Sheets atau pilih file .csv, lalu <b>Periksa Data</b>.</li></ol>' +
    '<div class="flex flex-wrap gap-2 mt-3"><button type="button" class="btn btn-s btn-sm" id="b-tpl-kk"><i class="fa-solid fa-download"></i> Unduh template CSV</button>' +
    '<label class="btn btn-s btn-sm cursor-pointer"><i class="fa-solid fa-file-csv"></i> Pilih file CSV<input type="file" id="imkk-file" accept=".csv,.txt,text/csv,text/plain" class="hidden"></label></div>' +
    '<label class="lbl">Data KK</label><textarea class="inp font-mono text-xs" name="teks" id="imkk-teks" style="min-height:160px"></textarea>' +
    '<p class="text-xs text-slate-500 mt-2">Blok terdaftar: ' + h(S.cfg.GANG.join(', ')) + '. Tanggal boleh format 2015-03-12 atau 12/03/2015. NIK yang sudah terdaftar dilewati.</p>' +
    '<button class="btn btn-s w-full mt-4" id="b-cek-kk"><i class="fa-solid fa-magnifying-glass"></i> Periksa Data</button><div id="imkk-hasil"></div></form>', { lebar: true });
  document.getElementById('b-tpl-kk').onclick = function () {
    var g = S.cfg.GANG[0] || 'Blok A';
    var isi = '﻿no_kk,nik,nama,hubungan,jk,tempat_lahir,tgl_lahir,agama,pendidikan,pekerjaan,status_kawin,gol_darah,nama_ayah,nama_ibu,blok,no_rumah,no_hp\n' +
      '3515xxxxxxxxxxxx,3515xxxxxxxxxxx1,Budi Santoso,Kepala Keluarga,L,Sidoarjo,1980-01-15,Islam,SLTA/Sederajat,Karyawan Swasta,Kawin,O,,,' + g + ',A-01,081234567890\n' +
      '3515xxxxxxxxxxxx,3515xxxxxxxxxxx2,Siti Aminah,Istri,P,Surabaya,1983-05-20,Islam,Diploma IV/Strata I,Guru,Kawin,A,,,,,\n';
    var url = URL.createObjectURL(new Blob([isi], { type: 'text\x2Fcsv' }));
    var a = document.createElement('a'); a.href = url; a.download = 'template-data-kk.csv'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 20000);

  document.getElementById('imkk-file').onchange = function () {
    var f = this.files[0]; if (!f) return;

  };
  var proses = function (btn, cekSaja) {
    var rows = bacaTabel(formData('f-imkk').teks);
    if (!rows.length) { toast('Tempel data atau pilih file CSV dulu.', 'err'); return; }
    kirim(btn, 'kk.import', { rows: rows, cekSaja: cekSaja }, function (r) {
      if (!cekSaja) { closeModal(); toast(r.ok + ' anggota keluarga diimpor (' + r.kkBaru + ' KK baru' + (r.akunTertaut ? ', ' + r.akunTertaut + ' akun tertaut' : '') + ').'); refresh(); return; }
      document.getElementById('imkk-hasil').innerHTML = '<div class="flex flex-wrap gap-2 items-center mt-4"><span class="chip bg-emerald-100 text-emerald-800"><i class="fa-solid fa-check"></i>' + r.ok + ' orang siap diimpor</span>' +
        '<span class="chip bg-sky-100 text-sky-800">' + r.kkBaru + ' KK baru</span>' + (r.akunTertaut ? '<span class="chip bg-slate-100 text-slate-700">' + r.akunTertaut + ' akun tertaut</span>' : '') +
        (r.gagal ? '<span class="chip bg-red-100 text-red-700"><i class="fa-solid fa-xmark"></i>' + r.gagal + ' bermasalah (dilewati)</span>' : '') + '</div>' +
        '<div class="overflow-x-auto mt-2 border rounded-xl max-h-72"><table class="w-full text-xs whitespace-nowrap"><thead class="bg-slate-50 sticky top-0"><tr class="text-left"><th class="p-2">#</th><th class="p-2">No. KK</th><th class="p-2">Nama</th><th class="p-2">Hubungan</th><th class="p-2">Hasil</th></tr></thead><tbody>' +
        r.hasil.map(function (x) {
          return '<tr class="border-t ' + (x.status === 'ok' ? '' : 'bg-red-50') + '"><td class="p-2">' + x.baris + '</td><td class="p-2 font-mono">' + h(x.no_kk) + '</td><td class="p-2 font-semibold">' + h(x.nama) + '</td><td class="p-2">' + h(x.hubungan) + '</td>' +
            '<td class="p-2 whitespace-normal min-w-[160px]">' + (x.status === 'ok' ? '<span class="text-emerald-700 font-semibold">OK' + (x.kkBaru ? ' &middot; KK baru' : '') + (x.akun ? ' &middot; akun ' + h(x.akun) : '') + '</span>' : '<span class="text-red-700">' + h(x.pesan) + '</span>') + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        (r.ok ? '<button class="btn btn-p w-full mt-3" id="b-imkk"><i class="fa-solid fa-file-import"></i> Impor ' + r.ok + ' Orang</button>' : '');
      var bi = document.getElementById('b-imkk');
      if (bi) bi.onclick = function () { proses(this, false); };
    });
  };
  document.getElementById('b-cek-kk').onclick = function () { proses(this, true); };
}

function izinModal(uid) {

  call('izin.info', { user_id: uid }).then(function (d) {
    var tg = d.tunggakan;
    var stLabel = { aktif: 'bg-amber-100 text-amber-800', dipakai: 'bg-emerald-100 text-emerald-800', kedaluwarsa: 'bg-slate-100 text-slate-600', dicabut: 'bg-red-100 text-red-700' };
    var riwayat = d.riwayat.length ? '<h4 class="font-bold text-sm mt-5 mb-1">Riwayat izin</h4><div class="divide-y text-sm">' + d.riwayat.map(function (z) {
      return '<div class="py-2"><div class="flex justify-between gap-2"><span class="text-xs text-slate-500">' + tgl(z.dibuat) + ' &middot; ' + h(z.oleh) + '</span><span class="chip ' + (stLabel[z.status] || '') + '">' + h(z.status) + '</span></div><div>' + h(z.alasan) + '</div></div>';
    }).join('') + '</div>' : '';
    var isi = '<div class="rounded-xl bg-slate-50 p-3"><div class="font-bold">' + h(d.nama) + '</div>' +
      (tg.periode.length ? '<div class="text-sm text-red-700 mt-1">Tunggakan IPL ' + tg.periode.length + ' bulan (' + rp(tg.total) + '): ' + tg.periode.map(periodeLabel).join(', ') + '</div>' :

    else if (d.izin) {
      isi += '<div class="rounded-xl border border-amber-300 bg-amber-50 p-3 mt-3 text-sm"><b>Izin aktif</b> s.d. ' + tglPendek(d.izin.sampai) + ' dari ' + h(d.izin.oleh) + '<br>Alasan: ' + h(d.izin.alasan) + '</div>' +
        '<button class="btn btn-d w-full mt-3" id="b-cabut"><i class="fa-solid fa-lock"></i> Cabut Izin</button>';
    } else if (tg.periode.length) {
      isi += '<form id="f-izin" onsubmit="return false"><p class="text-sm text-slate-600 mt-3">Izin ini membuka blokir untuk <b>1 kali pengajuan surat</b>. Tunggakan tetap tercatat dan harus dilunasi.</p>' +

        '<button class="btn w-full mt-5 bg-amber-500 text-white" id="b-izin"><i class="fa-solid fa-unlock"></i> Buka Blokir Sekarang</button></form>';

    var bi = document.getElementById('b-izin');
    if (bi) bi.onclick = function () { var o = formData('f-izin'); o.user_id = uid; kirim(this, 'izin.buka', o, function (r) { closeModal(); toast(r.pesan); }); };

  jk: 'jk', 'jenis kelamin': 'jk', 'l/p': 'jk', peran: 'role', role: 'role', jabatan: 'role',

var URUT_IMPOR = ['nama', 'no_hp', 'gang', 'no_rumah', 'nik', 'jk', 'role'];

function pecahBaris(line, sep) {
  var out = [], cur = '', q = false;
  for (var i = 0; i < line.length; i++) {
    var c = line.charAt(i);
    if (q) { if (c === '\x22') { if (line.charAt(i + 1) === '\x22') { cur += c; i++; } else q = false; } else cur += c; }
    else if (c === '\x22') q = true;
    else if (c === sep) { out.push(cur.trim()); cur = ''; }
    else cur += c;
  }
  out.push(cur.trim());
  return out;
}

function bacaTabel(teks) {
  var lines = String(teks || '').replace(/^\uFEFF/, '').split(/\r?\n/).filter(function (l) { return l.trim(); });
  if (!lines.length) return [];
  var l0 = lines[0];
  var sep = l0.indexOf('\t') >= 0 ? '\t' : (l0.split(';').length > l0.split(',').length ? ';' : ',');
  var pertama = pecahBaris(l0, sep).map(function (x) { return x.toLowerCase(); });
  var adaHeader = pertama.some(function (x) { return KOLOM_IMPOR[x] === 'nama'; });
  var kolom = adaHeader ? pertama.map(function (x) { return KOLOM_IMPOR[x] || ''; }) : URUT_IMPOR;
  return lines.slice(adaHeader ? 1 : 0).map(function (l) {
    var sel = pecahBaris(l, sep), o = {};
    kolom.forEach(function (k, i) { if (k) o[k] = sel[i] || ''; });
    return o;
  });
}

function muatXlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (muatXlsx.janji) return muatXlsx.janji;
  muatXlsx.janji = new Promise(function (ok, gagal2) {
    var sc = document.createElement('script');
    sc.src = 'https:' + '\x2F\x2F' + 'cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = function () { ok(window.XLSX); };
    sc.onerror = function () { muatXlsx.janji = null; gagal2(new Error('Gagal memuat pembuat file Excel. Periksa koneksi internet.')); };
    document.head.appendChild(sc);
  });
  return muatXlsx.janji;
}

function unduhBlob(data, nama, tipe) {
  var url = URL.createObjectURL(new Blob([data], { type: tipe }));
  var a = document.createElement('a');
  a.href = url; a.download = nama; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
}

function simpanXlsx(lembar, nama) {
  return muatXlsx().then(function (X) {
    var wb = X.utils.book_new();
    lembar.forEach(function (l) {
      var ws = X.utils.aoa_to_sheet(l.data);
      if (l.lebar) ws['!cols'] = l.lebar.map(function (w) { return { wch: w }; });
      if (l.gabung) ws['!merges'] = l.gabung;
      X.utils.book_append_sheet(wb, ws, l.nama.slice(0, 31));
    });
    unduhBlob(X.write(wb, { bookType: 'xlsx', type: 'array' }), nama, 'application\x2Fvnd.openxmlformats-officedocument.spreadsheetml.sheet');
    toast('Excel diunduh: ' + nama);
  });
}

function kepalaXlsx(judul, periode, d) {
  return [[judul], [periode], ['RT ' + S.cfg.RT + ' / RW ' + S.cfg.RW + ' ' + S.cfg.SEBUTAN_DESA + ' ' + S.cfg.DESA + ', Kec. ' + S.cfg.KECAMATAN], ['Dicetak: ' + tgl(d.dicetak) + ' oleh ' + d.oleh], []];
}

function excelKas(d) {

  t.push(['', '', '', 'Jumlah', d.masuk, d.keluar, d.saldoAkhir, '']);
  var rk = kepalaXlsx('Ringkasan Keuangan Kas RT', 'Periode ' + d.periode, d);

  d.kategori.forEach(function (k) { rk.push([k.kategori, k.masuk, k.keluar]); });

    'Laporan Kas ' + (d.jenis ? d.jenis + ' ' : '') + 'RT' + S.cfg.RT + ' ' + d.dari + ' sd ' + d.sampai + '.xlsx');
}

function senin(ymd) {
  var p = ymd.split('-'), dt = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12);
  dt.setDate(dt.getDate() - ((dt.getDay() + 6) % 7));
  var f = function (x) { return x.getFullYear() + '-' + ('0' + (x.getMonth() + 1)).slice(-2) + '-' + ('0' + x.getDate()).slice(-2); };
  var akhir = new Date(dt.getTime()); akhir.setDate(akhir.getDate() + 6);
  return [f(dt), f(akhir)];
}

function paramIpl() {
  var g = S.sub.lapIplP || (S.sub.lapIplP = { mode: 'bulan', tanggal: hariIni(), bulan: hariIni().slice(0, 7), tahun: hariIni().slice(0, 4) });
  if (g.mode === 'minggu') { var w = senin(g.tanggal); return { mode: 'minggu', dari: w[0], sampai: w[1] }; }
  if (g.mode === 'bulan') return { mode: 'bulan', bulan: g.bulan };
  return { mode: 'tahun', tahun: g.tahun };
}

function paramKas() {
  var g = S.sub.lapKasP || (S.sub.lapKasP = { mode: 'bulan', tanggal: hariIni(), bulan: hariIni().slice(0, 7), tahun: hariIni().slice(0, 4), dari: hariIni().slice(0, 8) + '01', sampai: hariIni() });
  if (g.mode === 'minggu') { var w = senin(g.tanggal); return { dari: w[0], sampai: w[1] }; }
  if (g.mode === 'bulan') {
    var y = Number(g.bulan.slice(0, 4)), m = Number(g.bulan.slice(5, 7));
    return { dari: g.bulan + '-01', sampai: g.bulan + '-' + ('0' + new Date(y, m, 0).getDate()).slice(-2) };
  }
  if (g.mode === 'tahun') return { dari: g.tahun + '-01-01', sampai: g.tahun + '-12-31' };
  return { dari: g.dari, sampai: g.sampai };
}

function muatGambar(src) {

    im.onerror = function () { ok(null); };
    im.src = src;
  });
}

function gambarKuitansi(d) {
  var W = 1050, H = 1480, HIJAU = '#15803d', TUA = '#14532d', MUDA = '#dcfce7';
  var c = document.createElement('canvas');
  c.width = W; c.height = H;
  var g = c.getContext('2d');
  var font = function (uk, tebal) { g.font = (tebal ? 'bold ' : '') + uk + 'px Arial, Helvetica, sans-serif'; };
  var muat = function (teks, maks, uk, tebal) { var u = uk; font(u, tebal); while (g.measureText(teks).width > maks && u > 12) { u--; font(u, tebal); } return u; };
  var tulis = function (teks, x, y, uk, tebal, warna, rata, maks) {
    g.fillStyle = warna || '#111827'; g.textAlign = rata || 'left';
    if (maks) muat(teks, maks, uk, tebal); else font(uk, tebal);
    g.fillText(teks, x, y);
  };

    var kata = teks.split(' '), baris = '';
    kata.forEach(function (k) {
      var coba = baris ? baris + ' ' + k : k;
      if (g.measureText(coba).width > maks && baris) { g.fillText(baris, x, y); y += tinggi; baris = k; } else baris = coba;
    });

  return Promise.all([muatGambar(d.kop.LOGO), muatGambar(d.ttd), muatGambar(d.kop.LOGO_PERUMAHAN)]).then(function (img) {
    var logo = img[0], ttd = img[1], logoPrm = img[2];
