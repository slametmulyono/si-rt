    g.beginPath(); g.moveTo(W - 230, 0); g.lineTo(W, 0); g.lineTo(W, 210); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(0, H - 230); g.lineTo(0, H); g.lineTo(230, H); g.closePath(); g.fill();
    g.fillStyle = '#ffffff'; g.fillRect(34, 34, W - 68, H - 68);

    g.strokeStyle = HIJAU; g.lineWidth = 4; g.strokeRect(48, 48, W - 96, H - 96);
    g.lineWidth = 1.5; g.strokeRect(58, 58, W - 116, H - 116);
    for (var i = 0; i < 6; i++) { daun(92, 520 + i * 150, 34, 'rgba(21,128,61,0.07)'); daun(W - 92, 600 + i * 140, 30, 'rgba(21,128,61,0.07)'); }

    var k = d.kop, kx = 90, ky = 88;

    if (logoPrm) {

      g.drawImage(logoPrm, (W - pw) / 2, ky + (120 - ph) / 2, pw, ph);
      tulis('RUKUN TETANGGA ' + k.RT + ' / RUKUN WARGA ' + k.RW, W / 2, ky + 160, 27, true, TUA, 'center', W - 200);
      tulis(alamat, W / 2, ky + 190, 19, false, '#374151', 'center', W - 200);
    } else {

      var tx = kx + 140, tmax = W - tx - 90;

      tulis(String(k.PERUMAHAN || '').toUpperCase(), tx, ky + 68, 21, true, '#1f2937', 'left', tmax);
      tulis(k.SEBUTAN_DESA + ' ' + k.DESA + ', Kec. ' + k.KECAMATAN, tx, ky + 98, 20, false, '#374151', 'left', tmax);

    tulis(iuran ? d.namaIuran + ' – RT ' + k.RT + ' / RW ' + k.RW : 'Iuran Pengelolaan Lingkungan – RT ' + k.RT + ' / RW ' + k.RW, W / 2, 404, 23, true, '#111827', 'center', W - 180);
    tulis('No. Kuitansi: ' + d.no, 80, 452, 21, true, '#111827', 'left', 560);
    tulis('Tanggal: ' + tglPanjang(d.tanggal), W - 80, 452, 21, false, '#111827', 'right', 380);

    var X = 80, LW = 300, TW = W - 160, y = 470;
    g.fillStyle = HIJAU; g.fillRect(X, y, LW, 16); g.fillStyle = '#9ca3af'; g.fillRect(X + LW + 6, y, TW - LW - 6, 16);
    y += 16;
    var tahun = d.periode.map(function (p) { return p.slice(0, 4); }).filter(function (t, i2, a) { return a.indexOf(t) === i2; });
    var baris = [
      ['Nama Warga', 70], ['Blok / No. Rumah', 70], ['No. WhatsApp', 70], iuran ? ['Pembayaran untuk', 90] : ['Bulan yang Dibayar' + (tahun.length === 1 ? ' (' + tahun[0] + ')' : ''), 138],

    ];
    var kotak = function (x, yy, on, teks, uk) {
      g.lineWidth = 2; g.strokeStyle = '#111827'; g.fillStyle = on ? HIJAU : '#ffffff';
      g.fillRect(x, yy - 22, 26, 26); g.strokeRect(x, yy - 22, 26, 26);
      if (on) { g.strokeStyle = '#ffffff'; g.lineWidth = 4; g.beginPath(); g.moveTo(x + 5, yy - 9); g.lineTo(x + 11, yy - 3); g.lineTo(x + 22, yy - 17); g.stroke(); }
      tulis(teks, x + 34, yy, uk || 23, on, on ? TUA : '#111827');
    };
    baris.forEach(function (b, idx) {
      var h = b[1];
      g.fillStyle = '#e5e7eb'; g.fillRect(X, y, LW, h); g.fillStyle = '#ffffff'; g.fillRect(X + LW, y, TW - LW, h);
      g.strokeStyle = '#1f2937'; g.lineWidth = 2; g.strokeRect(X, y, TW, h);
      g.beginPath(); g.moveTo(X + LW, y); g.lineTo(X + LW, y + h); g.stroke();
      tulis(b[0], X + 18, y + 44, 24, false, '#111827', 'left', LW - 26);
      var vx = X + LW + 20, vmax = TW - LW - 40;
      if (idx === 0) tulis(d.nama, vx, y + 45, 27, true, '#111827', 'left', vmax);
      if (idx === 1) tulis((d.no_rumah || '-') + (d.gang ? '  ·  ' + d.gang : ''), vx, y + 45, 25, false, '#111827', 'left', vmax);
      if (idx === 2) tulis(d.hp || '-', vx, y + 45, 25, false, '#111827', 'left', vmax);
      if (idx === 3 && iuran) {
        tulis(d.namaIuran, vx, y + 42, 26, true, TUA, 'left', vmax);
        if (d.tanggalKegiatan) tulis('Kegiatan: ' + tglPanjang(d.tanggalKegiatan), vx, y + 72, 18, false, '#374151', 'left', vmax);
      } else if (idx === 3) {
        var bulanOn = {};
        d.periode.forEach(function (p) { bulanOn[Number(p.slice(5, 7))] = true; });
        var NM = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
        if (tahun.length === 1) {
          for (var m = 0; m < 12; m++) kotak(vx + (m % 6) * 91, y + 46 + Math.floor(m / 6) * 46, !!bulanOn[m + 1], NM[m], 19);
        } else {
          var rk = ringkasPeriode(d.periode).split(' \u00b7 ');
          while (rk.length > 4) { var rk2 = []; for (var ri2 = 0; ri2 < rk.length; ri2 += 2) rk2.push(rk.slice(ri2, ri2 + 2).join(' \u00b7 ')); rk = rk2; }
          var jarak = Math.min(28, Math.floor(100 / rk.length)), uk = Math.min(20, jarak - 4);
          tulis(d.periode.length + ' bulan (' + tahun[0] + '\u2013' + tahun[tahun.length - 1] + ')', vx, y + 34, 20, true, TUA, 'left', vmax);
          rk.forEach(function (r, ri) { tulis(r, vx, y + 34 + jarak * (ri + 1), uk, false, '#111827', 'left', vmax); });
        }
      }
      if (idx === 4) { kotak(vx, y + 46, d.metode === 'Tunai', 'Tunai', 24); kotak(vx + 220, y + 46, d.metode === 'Transfer', 'Transfer', 25); }
      if (idx === 5) {
        tulis('Rp ' + Number(d.total).toLocaleString('id-ID'), vx, y + 46, 34, true, TUA, 'left', vmax);
        tulis(d.terbilang, vx, y + 82, 17, false, '#374151', 'left', vmax);
      }
      y += h;
    });

    y += 54;
    daun(102, y - 10, 28, HIJAU);
    tulis('Mari Peduli Lingkungan!', 140, y, 30, true, TUA);
    var akhirTeks = bungkus(iuran ? 'Terima kasih atas partisipasi dan kepedulian Anda. Kebersamaan warga membuat kegiatan lingkungan ' + (k.PERUMAHAN || 'kita') + ' berjalan lancar dan meriah.' + ' ' :
      'Dengan membayar IPL tepat waktu, kita bersama-sama menjaga kebersihan, keamanan, dan keasrian lingkungan ' +

    var sx = W - 290, sy = Math.max(akhirTeks + 4, H - 320);

    if (ttd) { var tw2 = 250, th2 = Math.min(100, ttd.height / ttd.width * tw2); g.drawImage(ttd, sx - tw2 / 2, sy + 8 + (100 - th2) / 2, tw2, th2); }
    else tulis('(belum ada tanda tangan digital)', sx, sy + 66, 15, false, '#9ca3af', 'center');

    tulis(d.petugas || '-', sx, sy + 146, 24, true, '#111827', 'center', 330);

    g.fillStyle = 'rgba(21,128,61,0.8)'; g.textAlign = 'center'; font(52, true); g.fillText('LUNAS', 0, 16);

    return c;
  });
}

function padTtd(el, awal) {
  el.innerHTML = '<div class="rounded-xl border-2 border-dashed border-slate-300 bg-white"><canvas id="ttd-pad" width="600" height="240" style="width:100%;height:auto;touch-action:none;display:block"></canvas></div>' +
    '<div class="flex gap-2 mt-2"><button type="button" class="btn btn-s btn-sm" id="ttd-ulang"><i class="fa-solid fa-eraser"></i> Ulangi</button>' +
    '<button type="button" class="btn btn-p btn-sm flex-1" id="ttd-simpan"><i class="fa-solid fa-floppy-disk"></i> Simpan Tanda Tangan</button>' +
    (awal ? '<button type="button" class="btn btn-d btn-sm" id="ttd-hapus"><i class="fa-solid fa-trash"></i></button>' : '') + '</div>';
  var cv = document.getElementById('ttd-pad'), g = cv.getContext('2d'), gores = false, ada = false, aktif = false, lx = 0, ly = 0;
  var bersih = function () { g.clearRect(0, 0, cv.width, cv.height); g.strokeStyle = '#e2e8f0'; g.lineWidth = 2; g.beginPath(); g.moveTo(40, 190); g.lineTo(560, 190); g.stroke(); ada = false; };
  bersih();
  if (awal) { var im = new Image(); im.onload = function () { g.drawImage(im, 0, 0, cv.width, cv.height); ada = true; }; im.src = awal; }
  var pos = function (e) { var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.addEventListener('pointerdown', function (e) { e.preventDefault(); aktif = true; var p = pos(e); lx = p[0]; ly = p[1]; if (!gores) { bersih(); gores = true; } cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', function (e) {
    if (!aktif) return;
    var p = pos(e); g.strokeStyle = '#0f172a'; g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(lx, ly); g.lineTo(p[0], p[1]); g.stroke(); lx = p[0]; ly = p[1]; ada = true;

      grup('fa-sliders', 'Lainnya',
        '<label class="lbl">Kontak darurat (satu per baris: Nama|Nomor)</label><textarea class="inp" name="KONTAK_DARURAT">' + h(v.KONTAK_DARURAT) + '</textarea>' +
        sel('IZINKAN_DAFTAR', 'Izinkan warga daftar sendiri', ['ya', 'tidak'])) +

    var tampilKop = function () {

        '<div class="border-t-[3px] border-black mt-2"></div><div class="border-t border-black mt-0.5"></div>';
    };
    tampilKop();
    pasangFoto('logoPrm', 640);
    document.getElementById('f-set').addEventListener('input', tampilKop);
    document.getElementById('f-set').addEventListener('change', tampilKop);
    document.getElementById('logo-reset').onclick = function () {
      S.data.logoBaru = '';
      tampilKop();
      toast('Logo bawaan dipakai lagi setelah disimpan.');
    };
    document.getElementById('logo-file').onchange = function () {
      var f = this.files[0];
      if (!f) return;
      kecilkanLogo(f).then(function (url) { S.data.logoBaru = url; tampilKop(); toast('Logo siap. Tekan Simpan Pengaturan.'); })
        .catch(function (e) { toast(e.message, 'err'); });
    };
    document.getElementById('b-set').onclick = function () {
      var o = formData('f-set');
      o.LOGO = S.data.logoBaru || '';
      o.LOGO_PERUMAHAN = S.data.logoPrm || '';
      kirim(this, 'setting.simpan', o, function () { toast('Pengaturan tersimpan.'); call('auth.me').then(function (m) { S.cfg = terimaCfg(m.cfg); renderShell(); go('setting'); }); });
    };
  }).catch(function (e) { gagal(el, e); });
};

function kecilkanLogo(file) { return kecilkanGambar(file, 300); }

function fotoPicker(key, foto, label) {
  S.data[key] = foto || '';
  return '<label class="lbl">' + label + '</label><div class="flex items-center gap-3"><div class="w-24 h-24 rounded-2xl border bg-slate-50 overflow-hidden flex items-center justify-center shrink-0" id="' + key + '-box">' + fotoIsi(foto) + '</div>' +
    '<div class="flex flex-col gap-2"><label class="btn btn-s btn-sm cursor-pointer"><i class="fa-solid fa-camera"></i> Pilih / ambil foto<input type="file" id="' + key + '-file" accept="image/png,image/jpeg" class="hidden"></label>' +
    '<button type="button" class="btn btn-sm text-slate-600 border" id="' + key + '-hapus"><i class="fa-solid fa-xmark"></i> Hapus foto</button></div></div>' +
    '<p class="text-xs text-slate-500 mt-1">Dari galeri atau kamera HP. Foto otomatis diperkecil.</p>';
}
function fotoIsi(foto) { return foto ? '<img src="' + foto + '" class="w-full h-full object-cover" alt="">' : '<i class="fa-regular fa-image text-3xl text-slate-300"></i>'; }
function pasangFoto(key, sisi) {
  var box = document.getElementById(key + '-box');
  document.getElementById(key + '-file').onchange = function () {
    var f = this.files[0];
    if (!f) return;
    box.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-slate-400"></i>';
    kecilkanGambar(f, sisi).then(function (url) { S.data[key] = url; box.innerHTML = fotoIsi(url); })
      .catch(function (e) { box.innerHTML = fotoIsi(S.data[key]); toast(e.message, 'err'); });
  };
  document.getElementById(key + '-hapus').onclick = function () { S.data[key] = ''; box.innerHTML = fotoIsi(''); };
}

function kecilkanGambar(file, sisiMaks) {
  return new Promise(function (resolve, reject) {
    if (!/^image\x2F(png|jpeg)$/.test(file.type)) { reject(new Error('Gunakan gambar JPG atau PNG.')); return; }
    var rd = new FileReader();
    rd.onerror = function () { reject(new Error('Gagal membaca file.')); };
    rd.onload = function () {
      var img = new Image();
      img.onerror = function () { reject(new Error('Gambar tidak bisa dibuka.')); };
      img.onload = function () {
        var sisi = sisiMaks || 300, q = 0.85, url = '';
        for (var i = 0; i < 8; i++) {
          var sk = Math.min(1, sisi / Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.round(img.width * sk); c.height = Math.round(img.height * sk);
          var g = c.getContext('2d');
          g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
          g.drawImage(img, 0, 0, c.width, c.height);
          url = c.toDataURL('image\x2Fjpeg', q);
          if (url.length <= 48000) { resolve(url); return; }
          if (q > 0.6) q -= 0.1; else sisi = Math.round(sisi * 0.8);
        }
        reject(new Error('Gambar terlalu besar setelah diperkecil. Coba gambar lain.'));
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}
